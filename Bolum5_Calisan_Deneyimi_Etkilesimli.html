sistemde eksik olan ve en çok bilgi taşıyan eksendir: Olaya karışan kişinin eğitimli mi olduğunu, eğitiminin yenilenme zamanının geçip geçmediğini bilmek, “eğitim var mı?” sorusunu “eğitim işe yarıyor mu?” sorusuna dönüştürür. Çalışan kategorisi ekseni de önemlidir: Yüklenici ya da dış kaynak işgücü kapsama alınmazsa riski en yüksek grup ölçümün dışında kalır. İşgücü kategorileri kurumun kendi faaliyetine göre belgelenmeli ve düzenli gözden geçirilmelidir.<\/p><h3 id=\"x42\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kurgusal örnek: Dört metrik ve iki türetilmiş oran<\/span><\/h3><p>Anadolu Örnek A.Ş.’nin ortalama kadrosu 1.200’dür. Planlanan çalışma süresi yıllık 2.160.000 saattir (çalışan başına 1.800 saat); gerçekleşen çalışma süresi aynı kabul edilmiştir. Yıl içinde 18 iş kazası olmuş, 5.400 saatlik (675 günlük) kayıp zaman oluşmuş, ölümlü kaza olmamış ve 1.104 çalışan İSG eğitimine katılmıştır.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Metrik<\/strong><\/p><\/th><th><p><strong>Hesap<\/strong><\/p><\/th><th><p><strong>Sonuç<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Kayıp zaman<\/strong><\/p><\/td><td><p><strong>5.400 ÷ 2.160.000 × 100<\/strong><\/p><\/td><td><p><strong>%0,25<\/strong><\/p><\/td><\/tr><tr><td><p><strong>İş kazası<\/strong><\/p><\/td><td><p><strong>18 ÷ 1.200 × 100<\/strong><\/p><\/td><td><p><strong>%1,5<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Ölümlü kaza<\/strong><\/p><\/td><td><p><strong>0 ÷ 1.200 (mutlak sayı: 0)<\/strong><\/p><\/td><td><p><strong>0<\/strong><\/p><\/td><\/tr><tr><td><p><strong>İSG eğitimine katılım<\/strong><\/p><\/td><td><p><strong>1.104 ÷ 1.200 × 100<\/strong><\/p><\/td><td><p><strong>%92,0<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Sıklık oranı (türetilmiş, 1.000.000 saat tabanı)<\/strong><\/p><\/td><td><p><strong>18 ÷ 2.160.000 × 1.000.000<\/strong><\/p><\/td><td><p><strong>8,33<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Ağırlık oranı (türetilmiş, 1.000.000 saat tabanı)<\/strong><\/p><\/td><td><p><strong>675 ÷ 2.160.000 × 1.000.000<\/strong><\/p><\/td><td><p><strong>312,5<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Dört metrik iyi görünür: eğitim katılımı %92, ölümlü kaza sıfır. Ancak sıklık oranı (kaç olay) ve ağırlık oranı (olay ne kadar ağır) birlikte okunduğunda ve olay anındaki eğitim durumu kırılımına inildiğinde farklı bir resim çıkabilir. Kurgusal örnekte 18 kazanın 11’i eğitim tazeleme süresi geçmiş çalışanlarda yaşanmıştır. Eğitim katılım oranı yüksekken olay sayısı da yüksekse soru eğitimin varlığı değil, içeriği ve zamanlamasıdır. Burada eğitimin yıllık tazelenmesi eksik; yani katılım oranı %92 olsa bile, katılımın zamanlaması sorunludur. Sıklık ve ağırlık oranları standardın parçası değildir; rehber sayfasında karşılaştırmayı kolaylaştırmak için türetilmiş metrik olarak sunulur.<\/p><h3 id=\"x43\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kurgusal vaka: Kayıt disiplini ve artan sayılar<\/span><\/h3><p>Anadolu Örnek A.Ş.’nin üretim tesisinde, yeni bir olay bildirim uygulaması devreye girdikten sonra iş kazası kaydı bir yılda 9’dan 18’e çıkmıştır. İlk bakışta bu kötüleşme gibi görünür. Ancak kırılımlar, artışın tamamının hafif olaylarda (tek gün kayıp, ilk yardım sonrası dönüş) olduğunu ve ağır olay sayısının sabit kaldığını gösterir. Ramak kala bildirimleri de aynı dönemde 12’den 85’e yükselmiştir. Standardın yorum ilkesi budur: Sayının artması her zaman kötüleşme değildir; yeni kurulan kayıt süreci ilk yıllarda sayıları yukarı çeker. Yönetim kuruluna sunulan raporda artış, ağırlık oranı ve ramak kala eğilimiyle birlikte açıklanmış, “bildirim kültürü gelişiyor” sonucuna varılmıştır. Rakamlar kurgusaldır.<\/p><h3 id=\"x44\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Önce kayıt süreci, sonra metrik<\/span><\/h3><p>Şartnamenin belki de en önemli mesajı sayıların değil, kayıt sürecinin önceliğidir. Tüm İSG olaylarını yakalayan bir kayıt ve yönetim süreci kurulmadan üretilen sayılar, iyileşmeyi değil eksik kaydı gösterir. Küçük kuruluşlarda basit bir hesap tablosu yeterli olabilir. Bu bağlamda kazasız süre göstergesi (son olaydan bu yana çalışılan saat ya da gün), önleyici programın göstergesi olarak kullanılabilir; ancak dikkatli kullanılmalıdır. Rekor kırma isteği, küçük olayların bildirilmemesine yol açabilir. Bu gösterge yalnızca bildirim kültürünün güçlü olduğu yerlerde anlamlıdır ve tek başına ödüllendirme ölçütü yapılmamalıdır.<\/p><h3 id=\"x45\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Yorum kuralları<\/span><\/h3><ul><li><strong>Sayının düşmesi her zaman güvenliğin arttığı anlamına gelmez.<\/strong> Kayıt disiplini gevşemiş, bildirim caydırılmış ya da kadro küçülmüş olabilir.<\/li><li><strong>Sayının artması her zaman kötüleşme değildir.<\/strong> Raporlamayı artıran farkındalık ve yeni kurulan kayıt süreci ilk yıllarda sayıları yukarı çeker.<\/li><li><strong>Kaza sayısı ile kayıp zamanı birlikte okuyun.<\/strong> Az sayıda ama ağır olay ile çok sayıda hafif olay aynı kaza oranını verir.<\/li><li><strong>Eğitim katılımı yüksekken olay sayısı da yüksekse<\/strong> eğitimin içeriğini ve zamanlamasını sorgulayın.<\/li><li><strong>Küçük kadrolarda yüzdeler oynaktır.<\/strong> Elli kişilik bir kuruluşta tek bir kaza %2 demektir; mutlak sayıyı yanına koyun.<\/li><\/ul><p>Payda seçimi de sonucu değiştirir: Aynı olay sayısı kadroya bölündüğünde ve çalışılan saate bölündüğünde farklı eğilimler gösterebilir. Fazla mesainin arttığı dönemlerde kadro tabanlı oran riski olduğundan düşük gösterir. Bu, Bölüm 5.1’deki aşırı bağlılık uyarısıyla doğrudan ilişkilidir: Fazla mesai hem bağlılığı hem kaza riskini yükseltebilir. Kişisel sağlık verisi hassastır; kırılımlar kişiyi tanınabilir kılacak kadar küçülmemeli, asgari grup büyüklüğü kuralı belirlenmelidir.<\/p><p>Standardın örnek tablolarında bir birim tutarsızlığı vardır: Kaza sayılarını gösteren tablonun üst bilgisinde “saat cinsinden değerler” ifadesi yer alırken satırlar olay sayısıdır. Ayrıca örneklerde payda verilmediği için yüzdeler örneklerden hesaplanamaz. Kendi tablonuzda birimi her satır için açıkça yazın.<\/p><p>Raporlamada İSG birimi ve İK dört metriği, dokuz eksende kırılımı, sıklık ve ağırlık oranını ve olay kök nedenlerini aylık analitik raporda görür. Üst yönetim ve kurul eğilimi, ölümlü kaza mutlak sayısını, kazasız süreyi, olayın maliyetini ve hedefe göre durumu skor kartında görür. Hat yönetimi kendi biriminin olay sayısını, vardiya ve eğitim durumu kırılımını; çalışan temsilcileri ve İSG kurulu olay türlerini, alınan önlemleri ve eğitim katılımını; düzenleyici ve dış paydaşlar kaza ve ölüm sayıları ile oranlarını (büyük kuruluşlarda ayrıca kayıp zamanı) yasal bildirim ve sürdürülebilirlik raporunda görür.<\/p><h3 id=\"x46\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Metrik kurulum adımları<\/span><\/h3><ol><li>İşgücü kategorilerini belgeleyin: kadrolu, geçici, yüklenici, dış kaynak.<\/li><li>Tüm İSG olaylarını yakalayan kayıt sürecini kurun.<\/li><li>Kayıp zaman ölçütünü sabitleyin: bir gün veya vardiya ve üzeri iş kaybı.<\/li><li>Paydaları tanımlayın: planlanan çalışma süresi ve ortalama kadro.<\/li><li>Dokuz kırılım eksenini veri modeline ekleyin; özellikle olay anındaki eğitim durumunu.<\/li><li>Eğitim zamanlaması gerekliliklerini yazın (yeni başlayanlar, tazeleme).<\/li><li>Önleme göstergesini ve ramak kala takibini seçin.<\/li><li>Karşılaştırma tabanını kurun: önceki dönem ve geçmiş üç ilâ beş yıl.<\/li><\/ol>", "heads": [["x38", "Standardın amacı ve konumu"], ["x39", "Kayıp zamanın dar tanımı"], ["x40", "Ölümlü kaza: Yüzde değil, mutlak sayı"], ["x41", "Dokuz kırılım ekseni"], ["x42", "Kurgusal örnek: Dört metrik ve iki türetilmiş oran"], ["x43", "Kurgusal vaka: Kayıt disiplini ve artan sayılar"], ["x44", "Önce kayıt süreci, sonra metrik"], ["x45", "Yorum kuralları"], ["x46", "Metrik kurulum adımları"]], "g": 0}, {"t": "5.5  İşgücü Devri ve Elde Tutma Metrikleri", "kind": "chap", "html": "<header class=\"uh\"><div class=\"kick\">Bölüm 5<\/div><h2>5.5  İşgücü Devri ve Elde Tutma Metrikleri<\/h2><\/header><p class=\"sub\"><em>ISO/TS 30421:2021 — İşgücü devrini ve elde tutmayı ölçmek, maliyetlendirmek ve karşılaştırılabilir biçimde raporlamak.<\/em><\/p><h3 id=\"x47\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Standardın amacı ve konumu<\/span><\/h3><p>ISO/TS 30421, bir kuruluşun işgücü devrini (turnover) ve elde tutma (retention) düzeyini ölçmek, maliyetlendirmek ve karşılaştırılabilir biçimde raporlamak için kullanılan bir teknik şartnamedir. Belge iki şey yapar: Kaba oranların nasıl hesaplanacağını tanımlar ve bu oranların bağlam olmadan yorumlanamayacağını gösterir. Bu bölüm, Bölüm 5’in son halkasıdır: Önceki bölümlerde ölçülen bağlılık, kültür, kapsayıcılık ve güvenlik sonuçta çalışanın kalıp kalmadığıyla görünür hâle gelir.<\/p><p>Şartnamenin ilişkili belgeleri bu bölümün kitaptaki yerini gösterir: ISO 30409 (Bölüm 2) devrin plana uyup uymadığını, ISO/TS 30407 (Bölüm 3) yerine koymanın maliyetini, ISO/TS 30410 ve 30411 (Bölüm 3) yeni işe alımın niteliğini ve etkisini belirler. İşgücü devri bu nedenle hem bir sonuç hem de çok sayıda önceki kararın toplamıdır.<\/p><h3 id=\"x48\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Üç ölçme amacı<\/span><\/h3><div class=\"tw\"><table><thead><tr><th><p><strong>Amaç<\/strong><\/p><\/th><th><p><strong>Ne yapılır?<\/strong><\/p><\/th><th><p><strong>Tipik çıktı<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>İç kıyaslama<\/strong><\/p><\/td><td><p><strong>Kurumun kendi birimleri, dönemleri ve iş aileleri karşılaştırılır; sıcak noktalar hedeflenir, elde tutma girişimlerinin başarısı ölçülür<\/strong><\/p><\/td><td><p><strong>Dönemler arası eğilim, birim sıralaması<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Dış kıyaslama<\/strong><\/p><\/td><td><p><strong>Sektör ortalaması, bölge verisi ya da kıyaslama kulübü verisiyle karşılaştırılır<\/strong><\/p><\/td><td><p><strong>Sektöre göre konum, fark analizi<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Nedeni anlama<\/strong><\/p><\/td><td><p><strong>Çıkış görüşmesi, memnuniyet anketi, çevrimiçi işveren değerlendirme siteleri, ayrılma sonrası anket ve kalanların analizi<\/strong><\/p><\/td><td><p><strong>Kaçınılabilir ve kaçınılamaz ayrılma dağılımı<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"x49\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Devir türlerinin dört ayrımı<\/span><\/h3><p>Şartnamenin en öğretici katkısı, devrin tek bir sayı olmadığını göstermesidir. Aynı yüzde, tamamen farklı olgulara karşılık gelebilir. Dört ayrım bu nedenle birlikte kullanılır.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Ayrım<\/strong><\/p><\/th><th><p><strong>Birinci tür<\/strong><\/p><\/th><th><p><strong>İkinci tür<\/strong><\/p><\/th><th><p><strong>Neden önemli?<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Kararı kim verdi?<\/strong><\/p><\/td><td><p><strong>Gönüllü (çalışan ayrılır)<\/strong><\/p><\/td><td><p><strong>Gönülsüz (işveren sonlandırır)<\/strong><\/p><\/td><td><p><strong>Gönüllü devir işverenleri karşılaştırmakta kullanılan ölçüdür ve en çok ilk kademe yöneticiden etkilenir<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Yönetimin denetiminde mi?<\/strong><\/p><\/td><td><p><strong>Kaçınılamaz (sağlık, taşınma, kişisel)<\/strong><\/p><\/td><td><p><strong>Kaçınılabilir (bir tür memnuniyetsizlik)<\/strong><\/p><\/td><td><p><strong>Yalnızca kaçınılabilir bölüm müdahaleye açıktır<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Kuruma etkisi<\/strong><\/p><\/td><td><p><strong>İşlevsel (düşük performansın çıkışı, yeni fikir girişi)<\/strong><\/p><\/td><td><p><strong>İşlevsiz (beceri ve bilgi kaybı)<\/strong><\/p><\/td><td><p><strong>Kaba oran ikisini ayırmaz; düşen oran her zaman iyi haber değildir<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Kurum ne hissediyor?<\/strong><\/p><\/td><td><p><strong>Üzücü olmayan<\/strong><\/p><\/td><td><p><strong>Üzücü (regrettable)<\/strong><\/p><\/td><td><p><strong>Üzücü devir çoğu kurumda kritik kadroyla örtüşür<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Bu ayrımlar bir yönetim önceliği çıkarır: Asıl hedef üzücü devirdir. Kurumun elde tutmak istediği kişinin gönüllü ayrılması beceri ve kurumsal bilgi kaybı, yeniden kadrolama maliyeti, verim düşüşü ve kalan ekipte moral etkisi yaratır. Düşük performansın ayrılması ise ücret tasarrufu ve yeni beceri girişi demektir; yani işlevsel devirdir. Sorun ayrılmaların işgücü planıyla uyumsuz olmasıdır, ayrılmanın kendisi değildir.<\/p><h3 id=\"x50\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Üç nicel yöntem<\/span><\/h3><ul><li><strong>Kaba oran (crude rate):<\/strong> Ayrılan sayısının ortalama mevcuda bölünmesi. Hızlıdır ve kıyaslanabilir, ama tek başına yorumlanamaz.<\/li><li><strong>İstikrar oranı (stability rate):<\/strong> Kişilerin kurumda ne kadar kaldığını gösterir; kaba oranın gizlediği “dönen kapı” etkisini ortaya çıkarır.<\/li><li><strong>Kohort analizi:<\/strong> Belirli bir grubun (bir yılın işe alımları, bir programın mezunları, bir birim) zaman içinde ne kadarının kaldığını izler.<\/li><\/ul><h3 id=\"x51\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Devir oranının hesabı: Aylık payda, yıllık toplam<\/span><\/h3><p>Şartnamenin temel hesap kuralı şudur: Payda aylıktır, oran yıllıktır. Aylık devir, o ayın ortalama mevcuduna (ay başı ve ay sonu mevcudunun ortalaması) bölünür; yıllık oran bu on iki aylık oranın toplamıdır. Yıl boyunca tek bir ortalamaya bölmek, işgücü büyüyen ya da küçülen kurumlarda sapma üretir.<\/p><aside class=\"box\"><p><strong>Aylık ve yıllık devir (kurgusal)<\/strong><\/p><p>Anadolu Örnek A.Ş.’de mart ayında ay başı mevcut 1.190, ay sonu mevcut 1.210, ayrılan 12 kişi olsun. Ortalama mevcut = (1.190 + 1.210) ÷ 2 = 1.200. Aylık devir = 12 ÷ 1.200 × 100 = %1,0. On iki aylık oranlar sırasıyla 1,0; 0,8; 1,2; 0,9; 1,1; 1,3; 1,0; 0,7; 1,2; 1,5; 0,9; 0,8 ise yıllık devir = toplamları = %12,4’tür.<\/p><\/aside><p>Yıllık devir %12,4 ise, basit elde tutma oranı 100 − 12,4 = %87,6 olarak yazılabilir. Yıl içinde ayrılan yaklaşık 149 kişi (1.200 × %12,4), yerine konulması gereken kadro anlamına gelir. Bu sayı doğrudan Bölüm 2’deki işgücü planının ve Bölüm 3’teki işe alım kapasitesinin girdisidir: İşe alım ekibinin yıl içinde yalnızca büyüme için değil, devri telafi etmek için de 149 kişi bulması gerekmektedir.<\/p><h3 id=\"x52\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kritik kadroda devir<\/span><\/h3><p>Kritik pozisyon, kurumsal sonuçlar üzerinde doğrudan ve belirgin etkisi olan roldür; güvenlik, iş sağlığı, büyüme ve sürdürülebilirlik gibi ölçütlerle belirlenir ve üst düzey olması gerekmez (Bölüm 3.5). Kritik kadroda devir, toplam işgücüne değil, o grubun ortalama mevcuduna bölünür. Çünkü otuz kişilik kritik gruptan yılda yirmi beş kişinin ayrılması, toplam işgücüne göre küçük görünür ama kritik grupta çok yüksek bir orandır.<\/p><p>Kurgusal şirketimizde 40 kişilik bir kritik kadro vardır; yıl içinde 6 kritik çalışan ayrılmıştır. Kritik devir = 6 ÷ 40 × 100 = %15,0’dır; genel devir (%12,4) ile yakın görünür, ama burada ayrılanların çoğu işlevsiz ve üzücüdür. ISO/TS 30410’daki formülle bu 6 ayrılışın etkisi (boşluk kaybı) hesaplanabilir; kritik pozisyonlar için yedekleme havuzu (ISO/TS 30433) bu devrin etkisini azaltır.<\/p><h3 id=\"x53\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Elde tutma oranları<\/span><\/h3><p>Devir oranı ile elde tutma oranı birbirinin aynası değildir. Aynı üç pozisyon yıl içinde defalarca el değiştirirse devir oranı yüksek, pozisyon temelli elde tutma oranı yine de %97 çıkabilir. Yüksek devirli işlerde (perakende, çağrı merkezi, konaklama) iki ölçü birlikte verilir.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Ölçü<\/strong><\/p><\/th><th><p><strong>Formül<\/strong><\/p><\/th><th><p><strong>Ne zaman?<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Basit elde tutma<\/strong><\/p><\/td><td><p><strong>100 − yıllık devir oranı<\/strong><\/p><\/td><td><p><strong>Devir düşükse<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Yüksek devirli elde tutma<\/strong><\/p><\/td><td><p><strong>(Dönem başı mevcut − toplam ayrılma + yeni çalışan ayrılması) ÷ dönem başı mevcut × 100<\/strong><\/p><\/td><td><p><strong>Devir yüksekse; yıl içinde işe alınıp ayrılanlar paya geri eklenir<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Pozisyon temelli elde tutma<\/strong><\/p><\/td><td><p><strong>Korunan pozisyon ÷ toplam pozisyon × 100<\/strong><\/p><\/td><td><p><strong>Aynı pozisyonun defalarca el değiştirdiği işlerde<\/strong><\/p><\/td><\/tr><tr><td><p><strong>İstikrar oranı<\/strong><\/p><\/td><td><p><strong>Bir yıldan kıdemli çalışan ÷ bir yıl önceki mevcut × 100<\/strong><\/p><\/td><td><p><strong>“Dönen kapı” etkisini görmek için<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Ortalama kıdem<\/strong><\/p><\/td><td><p><strong>Kümülatif kıdem (ay) ÷ kişi sayısı<\/strong><\/p><\/td><td><p><strong>Yılda bir kez, dönem sonunda<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Yüksek devirli elde tutma formülünün şartnamedeki yazımı bir belirsizlik taşır: Formülün paydası metinde “dönem başı mevcut + yeni alım” olarak yazılır, ancak sayısal örnek yalnızca dönem başı mevcuda bölerek %59 verir; yazılı formül aynı veriyle %26,3 üretir. Ortalama kıdem örneğinde de 14.566 ay ÷ 100 kişi = 145,66 ay bulunur ve bu “1 yıl 4 ay” yazılır; oysa 145,66 ay yaklaşık 12,1 yıldır. Bu tutarsızlıklar, kurum içi tanımın yazılı olarak sabitlenmesi ve paydanın raporda belirtilmesi gerektiğini gösterir.<\/p><h3 id=\"x54\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kurgusal örnek: İstikrar oranı<\/span><\/h3><p>Anadolu Örnek A.Ş.’de bir yıl önceki mevcut 1.150 kişiydi. Yıl sonunda bunların 1.020’si hâlâ çalışmaktadır (bir yıldan kıdemli). İstikrar oranı = 1.020 ÷ 1.150 × 100 = %88,7’dir. Kaba devir oranı %12,4’tür; iki sayı birbiriyle tutarlıdır. Ancak aynı dönemde işe alınıp yıl içinde ayrılanların sayısı yüksekse, kaba oran yüksek, istikrar oranı ise yüksek olabilir; bu fark, ayrılanların çoğunun yeni işe alınanlar olduğunu gösterir ve işe alım ile uyum sürecine bakmayı gerektirir.<\/p><h3 id=\"x55\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Devir maliyeti<\/span><\/h3><p>Şartnamenin pratik mesajı şudur: Oran karar aldırmaz, tutar aldırır. Ayrılma, işe alım ve hıza erişme maliyetleri hesaplanmadan elde tutma stratejisine üst yönetim desteği almak zordur. Toplam devir maliyeti üç ana bileşenin toplamıdır: ayrılma işlemleri (çıkış görüşmesi, idari zaman, tazminatlar), yerine alma (Bölüm 3.3’teki işe alım başına maliyet) ve hıza erişme (yeni çalışanın tam verimliliğe ulaşana kadarki verim kaybı).<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Kalem<\/strong><\/p><\/th><th><p><strong>Ayrılan başına (TL)<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Ayrılma işlemleri<\/strong><\/p><\/td><td><p><strong>8.000<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Yerine alma (işe alım başına maliyet)<\/strong><\/p><\/td><td><p><strong>28.000<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Hıza erişme (verim kaybı)<\/strong><\/p><\/td><td><p><strong>26.000<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Toplam<\/strong><\/p><\/td><td><p><strong>62.000<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"box\"><p><strong>Yıllık devir maliyeti (kurgusal)<\/strong><\/p><p>Yıllık yaklaşık 149 ayrılma × 62.000 TL = 9.238.000 TL. Bu tutar, doğrudan ve belgelenebilir kalemlerle başlayan bir alt sınırdır; verim kaybı, kurumsal bilgi kaybı ve ekip üzerindeki etki tam yakalanmamışsa gerçek maliyet daha yüksektir. Türkiye’de kıdem tazminatı, ihbar süresi ve hukuki giderler tutarın büyük bölümünü oluşturabilir.<\/p><\/aside><p>Bu tutar, bir elde tutma yatırımının eşiğini belirler. Eğer bir yönetici gelişim programı gönüllü devri 12,4’ten 10,4’e (yaklaşık 24 kişi daha az ayrılma) indirebiliyorsa, yıllık kazanç 24 × 62.000 = 1.488.000 TL’dir. Programın maliyeti bu tutarın altındaysa yatırım kendini karşılar. Bu hesabın bir kurgusal örnek olduğu ve nedensellik iddiası taşımadığı akılda tutulmalıdır; ama büyüklük sırasını gösterir.<\/p><h3 id=\"x56\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kurgusal örnek: Kohort analizi<\/span><\/h3><p>Anadolu Örnek A.Ş.’nin geçen yıl işe aldığı 120 kişilik kohort, bir yıl sonunda şöyle görünmektedir: 6. ayda 108 kişi kalmıştır (%90), 12. ayda 96 kişi (%80). Aynı kurumdaki genel yıllık devir %12,4’tür. İlk yılda %20’lik kayıp, genel devirden belirgin biçimde yüksektir; yani sorun mevcut çalışanların bağlılığından çok işe alım ve uyum sürecindedir. Kohort analizi bunu görünür kılar; kaba oran ise yalnızca tüm kurumun ortalamasını gösterir. Şartnamenin deneme dönemi kayıplarını “olası işe alım sorunları”, bir ile iki yıl arasındaki kayıpları “yaşanan kültürün beyan edilenden farklı olması” olarak yorumlamasının nedeni budur. Bu örnek kurgusaldır; Bölüm 3.4’teki işe alım kalitesi ve ISO 30405’in ön-uyum aşamasıyla doğrudan ilişkilidir.<\/p><h3 id=\"x57\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Yorum kuralları<\/span><\/h3><ul><li><strong>Devir oranının “iyi” bir eşiği yoktur.<\/strong> Perakende ve çağrı merkezinde %40 olağan, mühendislikte %10 yüksek sayılabilir.<\/li><li><strong>Düşen devir her zaman iyi haber değildir.<\/strong> Daralan işgücü piyasasında düşük devir, düşük performansın da kurumda kaldığı anlamına gelebilir.<\/li><li><strong>Gönüllü devir yöneticiyle ilişkilidir.<\/strong> Gönüllü devrin yönetici bazında kırılması, müdahaleyi hedefleyen en verimli tek adımdır.<\/li><li><strong>Gönülsüz devirin gecikmeli maliyeti vardır.<\/strong> Küçültme ve yeniden yapılanma, uzun vadede yüksek gönüllü devirin sonucu olabilir; iki seriyi aynı grafikte izleyin.<\/li><li><strong>Kritik kadroda düşük sayı yüksek oran demektir.<\/strong> Payda ayrı tutulur.<\/li><li><strong>Maliyet raporlanırken kapsamı yazın.<\/strong> Verim kaybı ve bilgi kaybı dahil edilmediyse tutar alt sınırdır.<\/li><\/ul><h3 id=\"x58\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Sık yapılan hatalar<\/span><\/h3><ul><li><strong>Yıllık devri tek bir ortalamaya bölmek.<\/strong> Aylık payda kuralını kullanın.<\/li><li><strong>Tüm devri aynı saymak.<\/strong> Gönüllü, kaçınılabilir ve üzücü devri ayırın.<\/li><li><strong>Kritik kadroyu toplam işgücü içinde eritmek.<\/strong> Ayrı payda ile izleyin.<\/li><li><strong>Yalnızca oranı raporlamak.<\/strong> Mutlak sayı ve maliyet olmadan eylem için destek bulmak zordur.<\/li><li><strong>Çıkış görüşmesine tek kaynak olarak güvenmek.<\/strong> Ayrılma sonrası anket ve kalanlarla görüşme ekleyin.<\/li><\/ul><h3 id=\"x59\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Ayrılma nedenini anlamak<\/span><\/h3><p>Devir oranının asıl değeri, nedeni anlamak için bir başlangıç noktası olmasıdır. Şartname çıkış görüşmesi, memnuniyet anketi, çevrimiçi işveren değerlendirme siteleri, ayrılma sonrası anket ve kalanların analizi gibi araçlar sayar. Bu araçların hepsinde yanlılık vardır: Ayrılan kişi köprüleri atmamak için gerçek nedeni her zaman söylemez. Ayrılmadan üç ila altı ay sonra yapılan anket ve kalanlarla yapılan görüşmeler bu yanlılığı azaltır. Ayrılma nedeni kodlama sistemi (istifa, emeklilik, küçültme, fesih; ardından gönüllü ve gönülsüz, kaçınılabilir ve kaçınılamaz) bu nedenle işe alım sisteminin tarih alanları kadar önemlidir.<\/p><p>Kültür ve bağlılık metrikleri bu analizde birleşir. ISO/TS 24178’in tutma kırılımı, ayrılma nedenlerini işe alım sorunu (deneme dönemindeki kayıplar), beyan edilen kültürün yaşanmaması (bir ila iki yıl arasındaki kayıplar) ve yönetici sorunu (belirli bölümlerdeki yoğunlaşma) olarak ayırır; ISO 23326’nın bağlılık ölçümleri ise bu üçünün hangisinin baskın olduğuna dair ipucu verir. Güvenlik kayıtları da ayrılma nedeni olabilir: Zayıf departman iş güvenliği kayıtları çalışanı elde tutmayı etkileyebilir.<\/p><h3 id=\"x60\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Elde tutma stratejisine geçiş<\/span><\/h3><p>Devir ve maliyet ölçümü, bir elde tutma stratejisinin ancak başlangıç noktasıdır. Standart bir strateji önermez; ancak ölçümlerin hangi kararlara hizmet edebileceğini gösterir. Sıcak nokta (birim, bölge, yönetici, kıdem dilimi) analizi müdahalenin nereye yöneleceğini; ayrılma nedeni analizi ne tür bir müdahalenin gerektiğini (işe alım, uyum, yönetici, ücret, kariyer); maliyet hesabı ise ne kadar yatırım yapılabileceğini belirler. Bu üç soru sırayla yanıtlandığında, elde tutma bir “genel memnuniyet” çabası olmaktan çıkıp hedefli bir programa dönüşür. Programın sonuçları ise bir sonraki dönemde devir, istikrar ve kohort ölçümleriyle sınanır.<\/p><h3 id=\"x61\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Sınırlamalar ve raporlama<\/span><\/h3><ul><li><strong>Aylık oranların toplanması ile toplam ayrılanın yıllık ortalamaya bölünmesi farklı sonuçlar verir.<\/strong> Yöntemi dönemler boyunca değiştirmeyin.<\/li><li><strong>Kaba oran<\/strong> işlevsel ve işlevsiz devri, kaçınılabilir ve kaçınılamaz ayrılmayı ayırmaz.<\/li><li><strong>Küçük birimlerde oran çok oynaktır.<\/strong> On kişilik bir ekipte bir ayrılma %10 devir demektir.<\/li><li><strong>Kırılımlı raporlamada mahremiyet riski vardır.<\/strong> Asgari grup büyüklüğü kuralı (örneğin beş kişi) belirleyin.<\/li><li><strong>Maliyet kalemleri ülkeye, sektöre ve sözleşme tipine göre değişir.<\/strong><\/li><\/ul><p>Raporlamada üst yönetim ve kurul İK skor kartında devir, elde tutma ve maliyet eğilimini, kritik kadro devrini ve sektör kıyaslamasını görür. İK ve işgücü planlama birimi kırılımlı sıcak nokta analizini, ayrılma nedenlerini ve kohort sonuçlarını; hat yöneticileri kendi birimlerinin devrini ve gönüllü ayrılma nedenlerini; dış paydaşlar ise ISO 30414 ile uyumlu toplam devir ve elde tutma göstergelerini yöntem dipnotuyla görür. Rapora kapsam (kimler sayılıyor), payda yöntemi, dönem ve kıyaslama bağlamı mutlaka eklenmelidir.<\/p><h3 id=\"x62\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Metrik seçim adımları<\/span><\/h3><ol><li>Kapsamı tanımlayın: kadrolu, geçici, mevsimlik ve taşeron işgücünün durumunu bir kez kararlaştırın.<\/li><li>Paydayı sabitleyin: ay başı, ay sonu ya da ortalama (standardın önerisi ortalamadır).<\/li><li>Ayrılma nedenini kodlayın ve gönüllü/gönülsüz, kaçınılabilir/kaçınılamaz olarak sınıflayın.<\/li><li>Kritik pozisyonları belirleyin (ISO 30409 ve ISO/TS 30410).<\/li><li>Kırılımları seçin: birim, bölge, kıdem dilimi, iş ailesi, yönetici, kritiklik.<\/li><li>Maliyeti hesaplayın: ayrılma, işe alım ve hıza erişme kalemleri.<\/li><li>Elde tutma ölçüsünü eşleştirin: devir düşükse basit oran, yüksekse pozisyon temelli ve istikrar oranı.<\/li><li>Kıyaslama bağlamını ekleyin: iç eğilim ve dış sektör verisi.<\/li><\/ol>", "heads": [["x47", "Standardın amacı ve konumu"], ["x48", "Üç ölçme amacı"], ["x49", "Devir türlerinin dört ayrımı"], ["x50", "Üç nicel yöntem"], ["x51", "Devir oranının hesabı: Aylık payda, yıllık toplam"], ["x52", "Kritik kadroda devir"], ["x53", "Elde tutma oranları"], ["x54", "Kurgusal örnek: İstikrar oranı"], ["x55", "Devir maliyeti"], ["x56", "Kurgusal örnek: Kohort analizi"], ["x57", "Yorum kuralları"], ["x58", "Sık yapılan hatalar"], ["x59", "Ayrılma nedenini anlamak"], ["x60", "Elde tutma stratejisine geçiş"], ["x61", "Sınırlamalar ve raporlama"], ["x62", "Metrik seçim adımları"]], "g": 0}, {"t": "Bölüm 5’in Özeti ve Bölüm 6’ya Geçiş", "kind": "chap", "html": "<header class=\"uh\"><div class=\"kick\">Bölüm 5<\/div><h2>Bölüm 5’in Özeti ve Bölüm 6’ya Geçiş<\/h2><\/header><p class=\"sub\"><em>Koşullar, algı, güvenlik ve devir tek bir deneyim zincirinde.<\/em><\/p><p>Bu bölümde çalışan deneyimini bir koşullar ve sonuçlar zinciri olarak ele aldık. ISO 23326 bağlılığı destekleyen beş koşulu ve üç boyutu tanımladı; aşırı bağlılığın da bir risk olduğunu hatırlattı. ISO/TS 24178 kültürü “burada işlerin yapılış biçimi” olarak tanımladı, ölçümün derinliğini kültürel olgunluğa bağladı ve 25 ifadelik temel bir anket sundu. ISO 30415 çeşitlilik ve kapsayıcılığı yönetişimden ürün ve tedarik zincirine uzanan bir çerçevede ele aldı. ISO/TS 24179 iş sağlığı ve güvenliğinin dört metriğini ve dokuz kırılım eksenini verdi. ISO/TS 30421 ise devri, elde tutmayı ve maliyeti hesaplamak için aylık payda–yıllık toplam kuralını ve dört ayrımı tanımladı.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Soru<\/strong><\/p><\/th><th><p><strong>Metrik<\/strong><\/p><\/th><th><p><strong>Rehber<\/strong><\/p><\/th><th><p><strong>Kime ve ne için?<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Çalışanlar bağlanıyor mu?<\/strong><\/p><\/td><td><p><strong>Boyut puanları, katılım, kapsama<\/strong><\/p><\/td><td><p><strong>ISO 23326<\/strong><\/p><\/td><td><p><strong>Üst yönetim ve İK: politika ve koşullar<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Kültür beyan edildiği gibi yaşanıyor mu?<\/strong><\/p><\/td><td><p><strong>25 ifadelik puan, bağlılık endeksi, tutma<\/strong><\/p><\/td><td><p><strong>ISO/TS 24178<\/strong><\/p><\/td><td><p><strong>İK ve liderler: değer–davranış boşluğu<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Kapsayıcı mıyız?<\/strong><\/p><\/td><td><p><strong>Temsil endeksi, geçiş oranı, ücret farkı, kapsama<\/strong><\/p><\/td><td><p><strong>ISO 30415<\/strong><\/p><\/td><td><p><strong>Kurul ve İK: hesap verebilirlik<\/strong><\/p><\/td><\/tr><tr><td><p><strong>İnsanlar güvende mi?<\/strong><\/p><\/td><td><p><strong>Kayıp zaman, kaza, ölümlü kaza, eğitim<\/strong><\/p><\/td><td><p><strong>ISO/TS 24179<\/strong><\/p><\/td><td><p><strong>İSG, hat yönetimi, düzenleyici<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Kimler gidiyor, bedeli ne?<\/strong><\/p><\/td><td><p><strong>Devir, elde tutma, istikrar, maliyet<\/strong><\/p><\/td><td><p><strong>ISO/TS 30421<\/strong><\/p><\/td><td><p><strong>Üst yönetim ve planlama: tutar ve öncelik<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"x63\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Beş bölümden çıkan ortak ilkeler<\/span><\/h3><ol><li><strong>Anonimlik ve mahremiyet her şeyin önündedir.<\/strong> Anketler, kırılımlar ve sağlık verileri kişiyi tanınabilir kılacak kadar küçülmemelidir; asgari grup büyüklüğü kuralı koyun.<\/li><li><strong>Sayı nedeni söylemez.<\/strong> Anket sonuçları odak gruplar, kent toplantıları ve çıkış görüşmeleriyle birlikte yorumlanmalıdır.<\/li><li><strong>Bölümleyin ve ortalamanın arkasına bakın.<\/strong> Genel endeks yüksekken bir boyut, bir bölge ya da bir kıdem düzeyi düşük olabilir.<\/li><li><strong>İki yönlü okuyun.<\/strong> Düşük şikâyet ve düşük kaza sayısı iyi haber olduğu kadar eksik bildirim işareti de olabilir; düşük devir düşük performansın kalması anlamına da gelebilir.<\/li><li><strong>Algı ile kayıt arasındaki farkı izleyin.<\/strong> Beyan edilen değerler ile yaşanan davranış, eğitim katılımı ile eğitimin zamanlaması arasındaki fark çoğu zaman en bilgilendirici sinyaldir.<\/li><li><strong>Kritik gruplara ayrı bakın.<\/strong> Kritik kadroda devir, kritik rollerde bağlılık ve kapsayıcılık ayrı payda ile izlenmelidir.<\/li><li><strong>Maliyeti görünür kılın.<\/strong> Devir maliyeti gibi tutarlar, insan odaklı önlemler için yönetim desteğini sağlar.<\/li><\/ol><p>Bu ilkeler, önceki bölümlerdeki güvenilir veri, işe alım ve öğrenme ölçümleriyle aynı ailedendir; ancak burada bir ek uyarı vardır: Çalışan deneyimi metrikleri insanların kendileri hakkındaki verilerdir ve bu veriyi toplamak bir güven sözü verir. Sonuçların çalışanlara geri anlatılması ve eyleme dönüşmesi, bir sonraki ölçümün katılımını ve doğruluğunu belirler.<\/p><p>Dört boyutun ortak noktası, ölçmenin bir iletişim eylemi olmasıdır. Çalışana bir anket gönderen ya da bir kaza kaydı isteyen kurum, o veriyle ne yapacağını da çalışana söylemiş olur. Bu nedenle bu bölümdeki her ölçümün yanında bir “geri bildirim planı” bulunmalıdır: sonuçlar ne zaman, hangi biçimde ve kimlerle paylaşılacak, hangi eylemler alınacak ve sonraki ölçüm ne zaman yapılacak?<\/p><h3 id=\"x64\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Başlangıç için önerilen yol haritası<\/span><\/h3><p>İlk üç ayda İSG olay kayıt sürecini ve ayrılma nedeni kodlamasını netleştirin, aylık devir ile dört İSG metriğini hesaplamaya başlayın (5.4 ve 5.5). Sonraki üç ayda 25 ifadelik temel kültür anketini ya da kurumun mevcut anketini beş yönde yeniden puanlayın ve en düşük iki ya da üç ifadeyi çalışanlarla tartışın (5.2). Altıncı aydan itibaren bağlılık öz değerlendirmesini yapın ve fazla çalışma payını izleyin (5.1). Yılın ikinci yarısında temsil endeksini, işe alım aşama geçiş oranlarını ve ücret farkını kıdem düzeylerine göre hesaplayın; Ek A kapsama puanını çıkarın (5.3). Bir yıl sonunda devir maliyetini yönetim kuruluna sunun ve bir elde tutma hedefi belirleyin.<\/p><h3 id=\"x65\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Bölüm 6’ya geçiş<\/span><\/h3><p>Çalışanların kurumda kalması, bağlanması ve güvende olması, kurumun asıl hedefi olan verimliliğin ön koşuludur; ama verimliliğin kendisi değildir. Kurumun insan sermayesine yaptığı yatırımın sonunda ne elde ettiği ve bunun toplam maliyetinin ne olduğu ayrı bir sorudur. Bir sonraki bölüm bu soruyu ele alır: Bölüm 6, işgücü üretkenliği metriklerini, maliyet metriklerini ve insan sermayesi yatırımının getirisini ve toplam maliyet görünümünü inceler. Böylece kitap, işgücünü planlamaktan işe almaya, geliştirmekten elde tutmaya uzanan zincirin ekonomik sonucunu hesaplayarak tamamlanır.<\/p>", "heads": [["x63", "Beş bölümden çıkan ortak ilkeler"], ["x64", "Başlangıç için önerilen yol haritası"], ["x65", "Bölüm 6’ya geçiş"]], "g": 0}]}</script>

U.forEach(function(u,i){u.i=i;u.text=null;u.words=Math.round(txt(u.html).split(' ').length);u.min=Math.max(1,Math.round(u.words/200))});

  us.forEach(function(u){h+='<a href="#u'+u.i+'" data-u="'+u.i+'"><span>'+esc(u.kind==='intro'?'Genel bakış':u.t)+'</span><span class="ck">'+(store.read[u.i]?'✓':'')+'</span></a>'});

 G.forEach(function(g,gi){var us=U.filter(function(u){return u.g===gi}),rd=us.filter(function(u){return store.read[u.i]}).length;
  h+='<button class="card" data-g="'+gi+'"><span class="ck2">'+esc(g.k||'Ek E')+'</span><b>'+esc(g.t)+'</b><div class="bar"><i style="width:'+Math.round(100*rd/us.length)+'%"></i></div><small>'+us.length+' sayfa · '+rd+' okundu</small></button>'});
 h+='</div></div>';main.innerHTML=h;tocEl.innerHTML='';$$('#side a').forEach(function(a){a.classList.remove('act')});

 $$('.card').forEach(function(c){c.onclick=function(){var g=+c.dataset.g;go(U.filter(function(u){return u.g===g})[0].i)}});
}
/* unit */
function go(i,opts){
 opts=opts||{};if(i<0||i>=U.length){home();history.replaceState(null,'','#');return}
 cur=i;store.last=i;save();var u=U[i];
 var h='<article>'+'<div class="meta"><span>'+esc(G[u.g].k?G[u.g].k+' · ':'')+esc(G[u.g].t)+'</span><span>'+u.min+' dk okuma</span><span>'+(i+1)+' / '+U.length+'</span></div>'+u.html+'<button class="done'+(store.read[i]?' on':'')+'" id="dn">'+(store.read[i]?'✓ Okundu':'○ Okundu olarak işaretle')+'</button></article>';
 var p=U[i-1],n=U[i+1];

 main.innerHTML=h;document.title=(u.kind==='intro'?G[u.g].t:u.t)+' — Bölüm 5';

 enhance();extras();toc(u);markSide();

 if(cur>=0){var a=$('#side a[data-u="'+cur+'"]');if(a){a.closest('.g').classList.add('open');var r=a.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight)a.scrollIntoView({block:'center'})}}

 });

/* extras: copy, csv viewer, modules, checkboxes, downloads */
var X=JSON.parse(document.getElementById('extra').textContent);
function dlBlob(name,txt,type){var b=new Blob([txt],{type:type||'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function parseCSV(s){var rows=[],r=[],f='',q=false,i=0,c;s=s.replace(/^\uFEFF/,'');for(;i<s.length;i++){c=s[i];if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!=='\r')f+=c}if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
function csvView(el){
 var name=el.dataset.f,rows=parseCSV(X.CSV[name]),head=rows.shift(),all=rows,view=rows.slice(),page=0,ps=20,sc=-1,dir=1;

 function draw(){var n=view.length,pages=Math.max(1,Math.ceil(n/ps));page=Math.min(page,pages-1);

  $('.cn',el).textContent=n+' / '+all.length+' satır';$('.pg',el).textContent='Sayfa '+(page+1)+' / '+pages;$('.pv',el).disabled=page===0;$('.nx',el).disabled=page>=pages-1}
 inp.oninput=function(){var v=inp.value.toLocaleLowerCase('tr');view=!v?all.slice():all.filter(function(r){return r.join(' ').toLocaleLowerCase('tr').indexOf(v)>=0});page=0;draw()};
 th.onclick=function(e){var h=e.target.closest('th');if(!h)return;var c=+h.dataset.c;dir=(sc===c)?-dir:1;sc=c;view.sort(function(a,b){var x=a[c]||'',y=b[c]||'',nx=parseFloat(x),ny=parseFloat(y);if(!isNaN(nx)&&!isNaN(ny)&&/^-?[\d.]+$/.test(x)&&/^-?[\d.]+$/.test(y))return(nx-ny)*dir;return x.localeCompare(y,'tr')*dir});page=0;draw()};
 $('.pv',el).onclick=function(){page--;draw()};$('.nx',el).onclick=function(){page++;draw()};
 $('.dlb',el).onclick=function(){dlBlob(name,'\uFEFF'+X.CSV[name],'text/csv;charset=utf-8')};
 draw();
}
function extras(){
 $$('.csvview',main).forEach(csvView);
