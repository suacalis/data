<style>
:root{--bg:#f7f9fb;--surface:#fff;--ink:#1c2630;--muted:#5b6672;--line:#dde3ea;--acc:#0b5c8a;--acc-soft:#e6f1f8;--acc-ink:#fff;--mark:#ffe58a;--box:#eef6fb;--code:#f1f4f7;--shadow:0 1px 2px rgba(20,40,60,.06),0 4px 14px rgba(20,40,60,.05)}

*{box-sizing:border-box}

.ib:hover{background:var(--acc-soft)}
.sbox{position:relative;flex:0 1 380px;min-width:120px}
.sbox input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 34px 0 12px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.sbox kbd{position:absolute;right:8px;top:8px;font:12px monospace;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}

.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 230px;max-width:1500px;margin:0 auto}
nav#side{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding:14px 10px 40px 14px;border-right:1px solid var(--line);font-size:14px}

nav#side .g.open .car{transform:rotate(90deg)}

.kick{color:var(--acc);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase}

h3.sec{display:flex;align-items:center;gap:8px;font-size:1.18em;color:var(--acc);margin:1.7em 0 .5em;padding-top:4px;border-top:1px dashed var(--line)}

h3.sec .tg::before{content:"";position:absolute;inset:0;margin:auto;width:6px;height:6px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:translateY(-1px) rotate(45deg);transition:transform .15s}
h3.sec.c .tg::before{transform:translateX(-1px) rotate(-45deg)}
.hide{display:none!important}
ul,ol{margin:0 0 1em;padding-left:1.4em}
li{margin:.25em 0}

thead th.sortable{cursor:pointer;user-select:none}

th .ar{opacity:.5;font-size:.8em;margin-left:4px}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--acc-soft) 35%,transparent)}

.tf{display:flex;gap:8px;align-items:center;margin:.8em 0 -.6em}
.tf input{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;width:240px;max-width:100%}
.tf span{font-size:12px;color:var(--muted)}
aside.box{background:var(--box);border-left:4px solid var(--acc);border-radius:8px;padding:13px 18px 8px;margin:1.2em 0}

pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;font-size:.85em}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.pn{display:flex;justify-content:space-between;gap:12px;max-width:820px;margin:18px auto 0}
.pn button{flex:1;text-align:left;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.pn button:hover{border-color:var(--acc);background:var(--acc-soft)}

aside#toc{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding:28px 14px 40px 6px;font-size:13px}
aside#toc h4{margin:0 0 8px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

#results{position:fixed;inset:56px 0 0 0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(3px);overflow:auto;padding:24px 16px 60px}
#results .in{max-width:760px;margin:0 auto}
#results .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:14px}

.res:hover{border-color:var(--acc)}

.res .rg{font-size:12px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

.card b{display:block;margin:4px 0 8px;line-height:1.3}
.card .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--acc)}
.card small{color:var(--muted)}
.menu{display:none}
@media(max-width:1180px){.layout{grid-template-columns:280px minmax(0,1fr)}aside#toc{display:none}}
@media(max-width:820px){
 .layout{grid-template-columns:1fr}
 nav#side{position:fixed;z-index:35;left:0;top:56px;width:min(88vw,320px);background:var(--surface);transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
 body.nav nav#side{transform:none}
 .menu{display:inline-flex}

 .top h1{display:none}

}

.cp:hover,.mini:hover{border-color:var(--acc)}

pre.py{font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;background:var(--code)}

:root[data-theme=dark] .py .k,:root[data-theme=dark] .py .kn,:root[data-theme=dark] .py .kd,:root[data-theme=dark] .py .ow{color:#c6a0ff}:root[data-theme=dark] .py .s,:root[data-theme=dark] .py .s1,:root[data-theme=dark] .py .s2,:root[data-theme=dark] .py .si{color:#7fd89a}:root[data-theme=dark] .py .mi,:root[data-theme=dark] .py .mf{color:#ffb070}:root[data-theme=dark] .py .nf,:root[data-theme=dark] .py .nc{color:#7cc4f0}
table.df{font-size:12.5px}.df th{text-align:right}.df td{text-align:right}.df tbody th{text-align:left}
.cb{cursor:pointer;font-size:1.15em;user-select:none}.cb.on{color:var(--acc)}
td.inp{background:#fff6cf}:root[data-theme=dark] td.inp{background:#3b3412}td.fl{background:var(--acc-soft)}td.b{font-weight:700}
.fx{color:var(--muted);font-style:italic;font-size:.85em}
.xl table{font-size:12.5px}.xl td{white-space:normal;min-width:70px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:1em 0}
.mod{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.mod:hover,.mod.on{border-color:var(--acc);background:var(--acc-soft)}
.mod b{display:block;font:600 12.5px ui-monospace,Consolas,monospace;word-break:break-all}.mod small{color:var(--muted);font-size:12px;line-height:1.3;display:block;margin-top:2px}
.mv{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.mv .ch{gap:8px}.mv pre{max-height:520px;margin:0;border:0;border-radius:0;font:12.5px/1.5 ui-monospace,Consolas,monospace}
.csvc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:.5em 0}.csvc input{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;width:220px}.csvc span{font-size:12px;color:var(--muted)}.csvc .sp{flex:1}
.csvv .tw{max-height:420px;margin:0 0 6px}.csvv table{font-size:12px}.csvv th{cursor:pointer}
.dl{margin:1em 0}.dl button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600}
</style>

<script id="data" type="application/json">{"groups": [{"k": "Bölüm 5", "t": "Çalışan Deneyimi: Bağlılık, Kültür, Çeşitlilik ve Sağlık"}], "units": [{"t": "Genel bakış", "kind": "intro", "html": "<header class=\"uh\"><div class=\"kick\">Bölüm 5<\/div><h1>Çalışan Deneyimi: Bağlılık, Kültür, Çeşitlilik ve Sağlık<\/h1><\/header><p class=\"sub\"><em>Çalışanların işte kalma, bağlanma ve iyi olma durumunu ölçmek.<\/em><\/p><p>Bölüm 3 çalışanın kuruma nasıl girdiğini, Bölüm 4 ise orada nasıl geliştiğini anlattı. Bu bölüm, üçüncü ve belki de en kırılgan soruyu ele alır: Çalışan kurumda nasıl bir deneyim yaşıyor ve bu deneyim onu kurumda tutuyor mu? Bir kurum, en iyi adayları işe alıp en iyi eğitimleri verebilir; ama çalışan kendini değerli ve güvende hissetmiyorsa, kendini kurumun amacına ve değerlerine yakın bulmuyorsa ya da işte sağlığını yitiriyorsa, yapılan her yatırım ayrılma kararının kapısında erir.<\/p><p>Çalışan deneyimi, diğer insan kaynakları alanlarından önemli bir bakımdan ayrılır: Sonucun büyük bölümü kurumun kontrol ettiği süreçlerden değil, çalışanın o süreçleri nasıl algıladığından doğar. Bir izin politikası kâğıt üzerinde cömert olabilir; ama yöneticisi izin kullanana kötü davranıyorsa çalışan bunu politikanın değil, kurumun kültürü olarak yaşar. Bu nedenle bu bölümdeki rehberlerin çoğu algıyı ölçer: anketler, odak grupları, çıkış görüşmeleri. Bir istisna iş sağlığı ve güvenliğidir; orada ölçülen şey, kayda geçen kazalar ve kaybolan zamandır. Ancak orada da sayıların anlamı, çalışanların olayları bildirmeye cesaret edip etmediğine bağlıdır.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Bölüm<\/strong><\/p><\/th><th><p><strong>Rehber<\/strong><\/p><\/th><th><p><strong>Temel soru<\/strong><\/p><\/th><th><p><strong>Ana çıktı<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>5.1  Çalışan Bağlılığı Rehberi<\/strong><\/p><\/td><td><p><strong>ISO 23326<\/strong><\/p><\/td><td><p><strong>Çalışanların bağlanmasını nasıl destekler ve izleriz?<\/strong><\/p><\/td><td><p><strong>Beş koşul, üç boyut, 67 rehber ifadesi, öz değerlendirme<\/strong><\/p><\/td><\/tr><tr><td><p><strong>5.2  Örgüt Kültürü Metrikleri Kümesi<\/strong><\/p><\/td><td><p><strong>ISO/TS 24178<\/strong><\/p><\/td><td><p><strong>Kültürümüz beyan ettiğimiz gibi mi yaşanıyor?<\/strong><\/p><\/td><td><p><strong>Bağlılık endeksi, 25 ifadelik temel anket, tutma oranı analitiği<\/strong><\/p><\/td><\/tr><tr><td><p><strong>5.3  Çeşitlilik ve Kapsayıcılık<\/strong><\/p><\/td><td><p><strong>ISO 30415<\/strong><\/p><\/td><td><p><strong>Herkes için adil ve kapsayıcı bir işyeri miyiz?<\/strong><\/p><\/td><td><p><strong>Ön koşullar, 177 eylem, 83 ölçü örneği, öz değerlendirme<\/strong><\/p><\/td><\/tr><tr><td><p><strong>5.4  İş Sağlığı ve Güvenliği Metrikleri<\/strong><\/p><\/td><td><p><strong>ISO/TS 24179<\/strong><\/p><\/td><td><p><strong>İnsanlar işte güvende ve sağlıklı mı?<\/strong><\/p><\/td><td><p><strong>Kayıp zaman, iş kazası, ölümlü kaza, eğitim katılımı<\/strong><\/p><\/td><\/tr><tr><td><p><strong>5.5  İşgücü Devri ve Elde Tutma Metrikleri<\/strong><\/p><\/td><td><p><strong>ISO/TS 30421<\/strong><\/p><\/td><td><p><strong>İnsanlar kalıyor mu, kimler gidiyor, bedeli ne?<\/strong><\/p><\/td><td><p><strong>Devir, elde tutma, istikrar oranı, devir maliyeti<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"x1\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Girdiden sonuca: koşullar, deneyim, davranış<\/span><\/h3><p>Beş bölüm bir zincirin farklı halkalarıdır. ISO 23326 ve ISO 30415, çalışanın deneyimini şekillendiren koşulları tarif eder: kültür, liderlik, öğrenme, iş tasarımı, ücret ve takdir, kapsayıcılık. ISO/TS 24178 ise kültürün çalışanlarca nasıl algılandığını ölçer. ISO/TS 24179, iş sağlığı ve güvenliğiyle çalışanın fiziksel güvenliğini izler. ISO/TS 30421 ise zincirin sonunda en görünür davranışı, yani çalışanın kalıp kalmadığını sayar. Zincirin sonundaki sayı en kolay ölçülen, başlangıcındaki koşullar ise en zor değiştirilendir; bu nedenle devir oranı tek başına bir hedef değil, öncü göstergelerin uyarı verdiği bir sonuçtur.<\/p><p>Önceki bölümlerle bağ da açıktır. Bölüm 2’deki işgücü planlaması ve yedekleme, devrin planlanan mı plansız mı olduğunu belirler. Bölüm 3’teki işe alım maliyeti, her ayrılışın yerine koyma bedelini oluşturur. Bölüm 4’teki liderlik güveni ve öğrenme yatırımı, bu bölümdeki bağlılık ve kültür ölçümlerinin kardeşleridir; çoğu kurumda aynı anket bu alanların hepsine girdi sağlar.<\/p><aside class=\"box\"><p><strong>Bu bölümdeki örnekler hakkında<\/strong><\/p><p>Şirket adı (Anadolu Örnek A.Ş.), anket sonuçları, tutarlar ve vakalar eğitim amaçlı kurgudur; gerçek bir kuruma ait değildir. Standartların kendi örneklerinden alınan sayılar (ör. 0–100 bağlılık endeksi tablosu, 25 ifadelik anket puanlaması) ayrıca belirtilmiştir. Standartların bazılarında formül yoktur; rehber sayfalarındaki formüller “türetilmiş” olarak işaretlenmiştir ve bu kitapta da aynı ayrım korunmuştur.<\/p><\/aside>", "heads": [["x1", "Girdiden sonuca: koşullar, deneyim, davranış"]], "g": 0}, {"t": "5.1  Çalışan Bağlılığı Rehberi", "kind": "chap", "html": "<header class=\"uh\"><div class=\"kick\">Bölüm 5<\/div><h2>5.1  Çalışan Bağlılığı Rehberi<\/h2><\/header><p class=\"sub\"><em>ISO 23326:2022 — Çalışan bağlılığını desteklemek için politika, süreç ve uygulamalara rehberlik.<\/em><\/p><h3 id=\"x2\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Standardın amacı ve konumu<\/span><\/h3><p>ISO 23326, çalışan bağlılığının (employee engagement) desteklenmesi için politika, süreç ve uygulamalara rehberlik eden ilk uluslararası standarttır; ISO/TC 260 tarafından 2022’de yayımlanmıştır. Standart bağlılığı tek bir tanıma bağlamaz. Çalışanın iyiliğine, kurumun iyiliğine ve istihdam ilişkisindeki karşılıklı kazanıma odaklanır; iş tatmini, kuruma bağlılık ve rol dışı davranış (isteğe bağlı çaba) gibi mevcut İK kavramlarının bir karışımı olarak görür. Bu çift odak, bağlılığın yalnızca kurumun çıkarı için çalışanı “sıkıştırma” aracı olmadığını, çalışanın deneyimini iyileştirmeyi de amaçladığını vurgular.<\/p><p>Standardın bir bağlılık tanımı, 4.2 maddesinde, kapsayıcı işyeri yaklaşımından doğan durum olarak verilir: Kurumdaki herkesin yapıcı bir sesi vardır ve kendi için anlamlı biçimde üretken katkı verir. Bu, kurumun kapsayıcı ve destekleyici bir ortam sunduğu, bireylerin ise isteğe bağlı çabayla karşılık verdiği iki yönlü bir süreçtir. “İki yönlü” ifadesi önemlidir; çünkü bağlılık yalnızca çalışanın tutumu değil, kurumun yaptıklarına verilen karşılıktır.<\/p><p>Belge bir rehberdir. Formül, ölçek ya da eşik içermez; ek yoktur ve normatif atıf yoktur. Ölçüm yalnızca yöntem olarak sayılır: odak grupları, çalışan anketleri ve geçerli araçlar. Bir yönetim sistemi şartnamesi değildir, sertifikalandırma için kullanılamaz ve uygunluk sınaması içermez. Ölçüm araçları, anket soruları, puanlama ve eşikler standardın dışında kalır. Bu sınır, bu bölümün geri kalanında da önemlidir: Burada verilen sayısal hesaplar standarda değil, rehber sayfasının türetmesine aittir.<\/p><h3 id=\"x3\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Beş koşul, bir durum, beş çıktı<\/span><\/h3><p>Standardın merkezî şeması (Şekil 1), kurumun değiştirebileceği beş koşulu işe bağlılıkla ve olası çıktılarla ilişkilendirir. Koşullar sırasıyla örgüt kültürü ve iletişim, destekleyici liderlik, örgütsel öğrenme, iş içeriği ve iş tasarımı, ücret ve takdirdir. Bağlılık durumu üç boyutla tanımlanır. Olası çıktılar ise bireysel iş tatmini ve iş kalitesi, kurumsal performans ve sürdürülebilirlik, daha iyi elde tutma, daha iyi müşteri hizmeti ve daha yüksek üretkenliktir. Standart bu çıktıları “olabilir” kipiyle anar; nedensellik kanıtı ya da etki büyüklüğü vermez.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Koşul<\/strong><\/p><\/th><th><p><strong>Madde<\/strong><\/p><\/th><th><p><strong>Odak<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Örgüt kültürü ve iletişim<\/strong><\/p><\/td><td><p><strong>6<\/strong><\/p><\/td><td><p><strong>Değerlerin çalışanlarla birlikte geliştirilmesi, iki yönlü iletişim, güçlendirme, çalışan temsili<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Destekleyici liderlik<\/strong><\/p><\/td><td><p><strong>7<\/strong><\/p><\/td><td><p><strong>Üst yönetici sorumluluğu, politika, kaynaklar, lider gelişimi, açık diyalog<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Örgütsel öğrenme<\/strong><\/p><\/td><td><p><strong>8<\/strong><\/p><\/td><td><p><strong>İşe başlama programı, ihtiyaç analizi, bütçe, kapsayıcı öğrenme, değerlendirme<\/strong><\/p><\/td><\/tr><tr><td><p><strong>İş içeriği ve iş tasarımı<\/strong><\/p><\/td><td><p><strong>9<\/strong><\/p><\/td><td><p><strong>Role uygun bilgi ve beceri, iş şekillendirme, çalışma ortamı, sağlığı geliştirme, iş–yaşam dengesi<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Ücret ve takdir<\/strong><\/p><\/td><td><p><strong>10<\/strong><\/p><\/td><td><p><strong>Adil ve şeffaf dışsal ücret, içsel takdir, meslektaş adaylama<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Bu tablo, bağlılığı “ölçmek” yerine “desteklemek” ile ilgili bir anlayış getirir. Çalışan bağlılığı anketi bir sonuç ölçer; koşullar ise kurumun doğrudan yönetebildiği girdilerdir. Rehberin 67 ifadesi (altı ila yedi başlık altında “kurumlar şunu yapmalı” biçiminde) bu girdileri düzenler. Madde başına ifade sayıları arasında örneğin örgütsel öğrenme (9 ifade), çalışma ortamı (8), liderlik (7), güçlendirme (7) ve sağlığı geliştirme (7) öne çıkar.<\/p><h3 id=\"x4\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Üç boyut ve ölçüm yaklaşımı<\/span><\/h3><p>Standart, bağlılığı bireysel düzeyde Schaufeli ve arkadaşlarının çalışmasına dayanan üç boyutla anlatır (madde 4.3).<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Boyut<\/strong><\/p><\/th><th><p><strong>Standarttaki anlamı<\/strong><\/p><\/th><th><p><strong>Örnek ifade<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Dinçlik (vigour)<\/strong><\/p><\/td><td><p><strong>Çalışırken yüksek enerji ve dayanıklılık; rolde çaba gösterme isteği<\/strong><\/p><\/td><td><p><strong>“İşimde kendimi enerjik hissediyorum.”<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Adanmışlık (dedication)<\/strong><\/p><\/td><td><p><strong>İşe güçlü katılım; işi gurur ve meydan okuma kaynağı olarak deneyimleme<\/strong><\/p><\/td><td><p><strong>“İşimle gurur duyuyorum.”<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Yoğunlaşma (absorption)<\/strong><\/p><\/td><td><p><strong>İşe tam konsantre olma ve işe dalma<\/strong><\/p><\/td><td><p><strong>“Çalışırken zamanın nasıl geçtiğini fark etmem.”<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Standart üç ölçüm yöntemi sayar: derinlemesine anlayış için odak grupları, iç geliştirilmiş ya da üçüncü taraf çalışan anketleri ve geçerli araçlar (Utrecht İşe Bağlılık Ölçeği, UWES gibi). Hepsinde anonimlik ve gizlilik bireysel düzeyde korunmalı, veri koruma mevzuatına uyulmalıdır. Standart hiçbir puan, eşik ya da gösterge belirlemez.<\/p><h3 id=\"x5\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kurgusal örnek: UWES benzeri puan ve katılım<\/span><\/h3><p>Rehber sayfası, 0–6 ölçekli ve boyut başına üç maddelik UWES kısa formu düzenini türetilmiş bir hesap olarak sunar. Anadolu Örnek A.Ş. kurgusal şirketi, 1.200 çalışanına anket göndermiş, 900’ünden yanıt almıştır.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Gösterge<\/strong><\/p><\/th><th><p><strong>Hesap<\/strong><\/p><\/th><th><p><strong>Sonuç<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Anket katılım oranı<\/strong><\/p><\/td><td><p><strong>900 ÷ 1.200 × 100<\/strong><\/p><\/td><td><p><strong>%75,0<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Dinçlik (ortalama, 0–6)<\/strong><\/p><\/td><td><p><strong>Üç maddenin ortalaması<\/strong><\/p><\/td><td><p><strong>4,2<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Adanmışlık (ortalama, 0–6)<\/strong><\/p><\/td><td><p><strong>Üç maddenin ortalaması<\/strong><\/p><\/td><td><p><strong>4,6<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Yoğunlaşma (ortalama, 0–6)<\/strong><\/p><\/td><td><p><strong>Üç maddenin ortalaması<\/strong><\/p><\/td><td><p><strong>3,8<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Genel bağlılık puanı<\/strong><\/p><\/td><td><p><strong>(4,2 + 4,6 + 3,8) ÷ 3<\/strong><\/p><\/td><td><p><strong>4,2<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Genel puan 4,2’dir, ama yoğunlaşma boyutu 3,8 ile en düşük olandır. Bu, çalışanların işlerini anlamlı buldukları (adanmışlık yüksek) ama işe tam odaklanmalarını engelleyen bir şey olduğu anlamına gelebilir: kesintiler, toplantı yoğunluğu ya da belirsiz öncelikler. Standardın koşul–boyut eşlemesi vermediği unutulmamalı; bu yalnızca bir inceleme ipucudur. Hiçbir sayının standart eşiği yoktur: Önceki ölçümler, gruplar arası farklar ve zaman içindeki eğilim okunmalı, dış karşılaştırma yapılacaksa aracın kendi norm verileri kullanılmalıdır.<\/p><p>Katılım oranı ayrıca bir yorum bilgisidir. %75 makul görünür, ama yanıt vermeyen 300 çalışanın hangi bölümlerden ve kıdemlerden olduğunu bilmek gerekir. Yanıt vermeyenler çoğu zaman en az bağlı olanlardır; bu durumda gerçek bağlılık raporlanandan düşük olabilir. Standart katılım eşiği vermez; ancak yüksek katılım, sonucun temsil gücünü artırır.<\/p><h3 id=\"x6\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Aşırı bağlılık da bir risktir<\/span><\/h3><p>Standardın dikkat çekici ve sıklıkla gözden kaçan bir uyarısı, sürekli yüksek bağlılığın riskleridir (4.1 ve 9.3). Çalışan sözleşmesinin üstünde, uzun süre çalışıyorsa, bu yüksek bağlılığın işareti olabilir; ama tükenmişliğin de öncüsüdür. Standart kurumlardan bu riski sistematik değerlendirmelerini, tükenmişliği önlemelerini, çalışma saatlerini, fazla mesaiyi ve anonim sağlık, güvenlik ve devamsızlık verilerini gözden geçirmelerini ve esneklik seçeneklerini duyurmalarını ister. Rehber sayfasındaki “fazla çalışma payı” göstergesi bu amaçla türetilmiştir: Toplam çalışma saatinin ne kadarının sözleşmeyi aştığı.<\/p><p>Kurgusal şirketimizde fazla çalışma payı %14’tür ve en yüksek bağlılık puanını (adanmışlık 4,6) alan bölümde %22’ye çıkmaktadır. İki sayının birlikte okunması, bu bölümde yüksek bağlılığın kısmen aşırı yüklenmeden kaynaklandığı sorusunu doğurur. Devamsızlık ve sağlık verileri (Bölüm 5.4) bu şüpheyi sınamak için kullanılır. Standardın “sağlık öncelikli” ilkesi tam olarak budur: Bağlılığı, çalışanın sağlığı pahasına artırmak amaç olamaz.<\/p><h3 id=\"x7\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Bağlılık ile ilgili benzer kavramlar<\/span><\/h3><p>Standardın girişi, bağlılığın iş tatmini, kuruma bağlılık ve rol dışı davranış gibi mevcut kavramların bir karışımı olduğunu söyler; bu da pratikte sık bir karışıklığa yol açar. İş tatmini, çalışanın işinden duyduğu memnuniyettir ve statik bir tutumdur. Kuruma bağlılık (örgütsel bağlılık), çalışanın kurumun bir parçası olarak kalma isteğidir. Çalışan bağlılığı ise bunların ötesinde, işe enerji, anlam ve odak getiren aktif bir durumdur. Memnun ama bağlı olmayan bir çalışan işini rahatça yapar ve kimseye zarar vermez; bağlı bir çalışan ise isteğe bağlı çaba gösterir. Kurum için ayrım pratiktir: Memnuniyet anketinin yüksek çıkması, çalışanların bağlı olduğunu göstermez. Bağlılık ölçeklerinin geçerli araçlarla ölçülmesi bu nedenle önerilir; memnuniyet soruları ise ücret ve yan haklar gibi alanları ölçer ve bağlılık için gerekli ama yeterli değildir.<\/p><h3 id=\"x8\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Çalışan sesi ve temsil<\/span><\/h3><p>Standart, çalışanları ve varsa tanınmış temsilcilerini, değerlerin geliştirilmesinde, risk değerlendirmesinde, sağlık yaklaşımının tasarımında, ücret çerçevesinde ve takdir yöntemlerinde danışılan taraf olarak konumlar. Bu, bağlılığın ölçülüp çalışanlara raporlanmasından fazlasıdır: Çalışanlar sonuçların yorumlanmasına ve eylem planına katıldığında, bağlılık için ek değer üretilir. Standart ulusal iş yasalarını ve toplu sözleşmeleri ihlal etmeyi amaçlamaz; çalışan temsilinin tanınmadığı yerlerde ise temsil kapsamı ve görevlerinin tanımlanmasını önerir.<\/p><h3 id=\"x9\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Öz değerlendirme: Kapsama puanı<\/span><\/h3><p>Rehber sayfası, 67 ifadenin her birini “uygulanıyor”, “kısmen uygulanıyor” ya da “uygulanmıyor” olarak işaretleyen bir öz değerlendirme tablosu sunar. Kapsama puanı türetilmiş bir ölçüdür: (uygulanan + 0,5 × kısmen) ÷ toplam × 100.<\/p><aside class=\"box\"><p><strong>Kapsama puanı (kurgusal)<\/strong><\/p><p>67 ifadenin 38’i uygulanıyor, 17’si kısmen uygulanıyor, 12’si uygulanmıyor olsun. Kapsama = (38 + 0,5 × 17) ÷ 67 × 100 = 46,5 ÷ 67 × 100 = %69,4. Kurumun hedefi %70 ise, hedefin hemen altındadır.<\/p><\/aside><p>Bu yüzde bir uygunluk puanı değildir. Standart, ifadelerin hepsinin her kurum için pratik ya da önemli olmayabileceğini söyler; uygulanmayan bir ifadenin “neden gerekli değil” gerekçesiyle belgelenmesi daha değerlidir. Ayrıca bazı ifadeler kurumun bir şeyi “kabul ettiğini”, bazıları somut bir şeye “sahip olduğunu” söyler; “uygulanıyor” işaretlemek için kanıt (politika metni, karar, uygulama kaydı) tutulması önerilir.<\/p><h3 id=\"x10\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Yorum, sınırlamalar ve raporlama<\/span><\/h3><ul><li><strong>Ortalama yerine dağılıma bakın.<\/strong> Yüksek genel puan, bir boyutun düşüklüğünü gizleyebilir.<\/li><li><strong>Katılım ve temsil gücünü birlikte okuyun.<\/strong> Düşük katılım, sonuçların tüm çalışanları temsil etmeme riski taşır.<\/li><li><strong>Anonimlik her zaman önceliklidir.<\/strong> Küçük gruplarda ya da birden çok kırılımın birleşiminde sonuçlar kişileri ele verebilir; asgari raporlama grubu büyüklüğünü kurum belirler.<\/li><li><strong>Nedensellik iddiasından kaçının.<\/strong> Üretkenlik ve elde tutma bağlılığın kanıtlanmış sonuçları değil, olası yararlarıdır.<\/li><li><strong>Çalışanlarla birlikte yorumlayın.<\/strong> Sonuçları odak gruplarda tartışmadan eylem planı yazmayın.<\/li><\/ul><p>Sınırlamalar da bilinmelidir. Standart ölçüm, formül ya da eşik vermez; UWES’in 0–6 ölçeği ve üçer maddelik boyut düzeni standartta yer almaz. “Çalışan bağlılığı” terimi standardın tanımlar maddesinde bulunmaz; 4.2 ve 4.3 birlikte okunur. Bazı atıf numaraları metinle tutarsızdır ve giriş ile 5.2 maddesindeki çıktı listeleri tam örtüşmez. Ayrıca standart sendika ve iş konseyi ilişkilerinin özel yönlerini kapsam dışı bıraktığını söylese de çalışan temsilcileriyle danışmayı birçok maddede anar.<\/p><p>Raporlamada yönetişim organları ve liderler, bağlılık politikasını, hedeflere karşı ilerlemeyi, elde tutma ve performansla ilişkiyi ve riskleri (aşırı bağlılık, tükenmişlik) yıllık raporda görür. İK uzmanları anket sonuçlarını, boyut puanlarını, öz değerlendirme kapsamasını ve veri koruma uyumunu izleme panosunda; yöneticiler kendi ekiplerinin (asgari grup büyüklüğü sağlanıyorsa) sonuçlarını; çalışanlar ve temsilciler ise değerlendirme yöntemlerini ve eylem planını görür.<\/p><h3 id=\"x11\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kurgusal vaka: Anket sonrası eylem<\/span><\/h3><p>Anadolu Örnek A.Ş.’nin bağlılık anketi sonuçları açıklandığında, üretim biriminde adanmışlık puanı 3,9 ile en düşük bölüm olmuştur. İK ekibi bunu hemen bir “bağlılık eğitimi” talebine çevirmek yerine, standardın yöntemini izlemiştir: Üç odak grubu toplanmış, çalışanlarla sonuçlar paylaşılmış ve beş koşul (kültür ve iletişim, liderlik, öğrenme, iş tasarımı, ücret ve takdir) birlikte gözden geçirilmiştir. Odak gruplarında öne çıkan konu ücret değil, iş tasarımıdır: Üretim hattındaki çalışanlar vardiya planının son anda değiştiğinden ve işlerinin neden önemli olduğunu hiçbir zaman duymadıklarından şikâyetçidir. Eylem planı iki başlıktan oluşmuştur: vardiya planının en az iki hafta önceden bildirilmesi ve ekip liderlerinin her ay hattın çıktısının müşteri etkisini anlatan kısa bir toplantı yapması. Altı ay sonra yapılan kısa tekrar anketinde adanmışlık puanı 4,3’e yükselmiştir. Bu vaka kurgusaldır; ancak standardın “çalışanlarla birlikte yorumlayın” ilkesinin ve koşulların çıktıdan önce ele alınması gerektiğinin pratik karşılığını gösterir.<\/p><h3 id=\"x12\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Sık yapılan hatalar<\/span><\/h3><ul><li><strong>Bağlılığı tek bir puana indirgemek.<\/strong> Üç boyut ve beş koşul ayrı okunmalıdır.<\/li><li><strong>Anketi yapıp sonuçları paylaşmamak.<\/strong> Bir sonraki ankette katılım ve güven düşer.<\/li><li><strong>Aşırı bağlılığı başarı saymak.<\/strong> Fazla mesaiyi ve sağlık verisini birlikte izleyin.<\/li><li><strong>Anketi tek başına bırakmak.<\/strong> Odak grupları ve geçerli araçlarla birlikte kullanın.<\/li><li><strong>Çalışanları sürece dahil etmemek.<\/strong> Standart danışmayı birçok maddede şart koşar.<\/li><\/ul><h3 id=\"x13\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Uygulama adımları<\/span><\/h3><ol><li>Bağlılığın kurumda ne anlama geldiği konusunda çalışanlar ve temsilcileriyle ortak anlayış kurun.<\/li><li>Üst yöneticilerin iş tanımına bağlılık koşullarını iyileştirme sorumluluğunu ekleyin; kaynak ayırın.<\/li><li>Mevcut durumu anket, odak grubu ve geçerli araçla ölçün; anonimliği güvenceye alın.<\/li><li>Öz değerlendirme tablosuyla beş koşulun her maddesindeki uygulama düzeyini belirleyin.<\/li><li>Değerlerin, rollerin, risk değerlendirmesinin ve ücret/takdir çerçevesinin tasarımına çalışanları dahil edin.<\/li><li>Aşırı bağlılığı izleyin: fazla mesai, devamsızlık ve anonim sağlık verisi.<\/li><li>Öğrenmeyi bağlılık etkinlikleriyle ilişkilendirin.<\/li><li>İlerlemeyi düzenli ölçün, sonuçları paylaşın ve politikayı iyileştirin.<\/li><\/ol>", "heads": [["x2", "Standardın amacı ve konumu"], ["x3", "Beş koşul, bir durum, beş çıktı"], ["x4", "Üç boyut ve ölçüm yaklaşımı"], ["x5", "Kurgusal örnek: UWES benzeri puan ve katılım"], ["x6", "Aşırı bağlılık da bir risktir"], ["x7", "Bağlılık ile ilgili benzer kavramlar"], ["x8", "Çalışan sesi ve temsil"], ["x9", "Öz değerlendirme: Kapsama puanı"], ["x10", "Yorum, sınırlamalar ve raporlama"], ["x11", "Kurgusal vaka: Anket sonrası eylem"], ["x12", "Sık yapılan hatalar"], ["x13", "Uygulama adımları"]], "g": 0}, {"t": "5.2  Örgüt Kültürü Metrikleri Kümesi", "kind": "chap", "html": "<header class=\"uh\"><div class=\"kick\">Bölüm 5<\/div><h2>5.2  Örgüt Kültürü Metrikleri Kümesi<\/h2><\/header><p class=\"sub\"><em>ISO/TS 24178:2021 — Bağlılık, memnuniyet ve bağlanma ile tutma oranı.<\/em><\/p><h3 id=\"x14\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Standardın amacı ve konumu<\/span><\/h3><p>ISO/TS 24178, ISO 30414’ün örgüt kültürü kümesini ayrıntılandıran bir teknik şartnamedir. Örgüt kültürünün unsurlarını anlatır, iç ve dış raporlama için karşılaştırılabilir ölçümlerin formülünü verir ve kültür verisini yorumlarken, özellikle iç müdahalelere karar verirken ve dış paydaşlara raporlarken dikkate alınacak konuları vurgular. Şartname iki metriği ele alır: bağlılık, memnuniyet ve bağlanma ile tutma oranı. Her biri için genel tanım, amaç, formül, bağlam etkenleri ve öngörü etkenleri verilir. Ek A’da çalışan anketiyle kültürün sağlığını değerlendirmek için 25 ifadelik bir temel anket ve puanlama yöntemi yer alır.<\/p><p>Şartnamenin temel tanımı basittir: Kültür, “burada işlerin yapılış biçimi”dir. Yapılan şey amaçtan (misyon ya da vizyon), nasıl yapıldığı ise değerlerden (davranışa yön veren ilkeler) oluşur. Kültürü değerlendiren her ölçüm sistemi hem amacı hem değerleri ele almalıdır. Şartname ayrıca dürüst bir sınır koyar: Etkili, güvenilir ve kabul görmüş kültür metrik yaklaşımları henüz emekleme aşamasındadır. Kurumlar anlayışlarını sürekli geliştirmeli ve metrikleri yüksek performanslı kültürü yönlendiren temel bileşenlere bağlamalıdır.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Bileşen<\/strong><\/p><\/th><th><p><strong>Yanıtladığı soru<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Genel tanım<\/strong><\/p><\/td><td><p><strong>Metrik neyi ölçer, hangi terimlerle anlatılır?<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Amaç<\/strong><\/p><\/td><td><p><strong>Hangi kurumsal soruya hizmet eder, kimler kullanır?<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Formül<\/strong><\/p><\/td><td><p><strong>Neyin, hangi araçla ve hangi soruyla ölçüleceği; nasıl hesaplanacağı<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Bağlam etkenleri<\/strong><\/p><\/td><td><p><strong>Sonucu bugün ne etkiliyor olabilir?<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Öngörü etkenleri<\/strong><\/p><\/td><td><p><strong>Bilinen ve beklenen olaylar sonucu nasıl değiştirecek?<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"x15\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Ölçümün derinliği kültürel olgunluğa bağlıdır<\/span><\/h3><p>Neyi ölçeceğinize karar verirken kritik etken, kurumun kendi benzersiz kültürünü belirlemedeki olgunluğudur. Şartname bunu dört aşamayla gösterir ve her aşamaya farklı bir ölçüm yaklaşımı atar.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Aşama<\/strong><\/p><\/th><th><p><strong>Olgunluk<\/strong><\/p><\/th><th><p><strong>Açıklama<\/strong><\/p><\/th><th><p><strong>Ölçme yaklaşımı<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>1<\/strong><\/p><\/td><td><p><strong>Gelişmemiş<\/strong><\/p><\/td><td><p><strong>Beklenen kültürü tanımlayan bir amaç, değer ya da ifade yok<\/strong><\/p><\/td><td><p><strong>Genel işgücü memnuniyeti sorularına dayalı<\/strong><\/p><\/td><\/tr><tr><td><p><strong>2<\/strong><\/p><\/td><td><p><strong>Erken<\/strong><\/p><\/td><td><p><strong>İstenen kültür geliştirilmiş; istenen ile mevcut gerçeklik arasındaki boşluk değerlendirilmiş<\/strong><\/p><\/td><td><p><strong>Memnuniyet göstergeleri ile istenen kültüre karşı gerçek performansı karıştıran sorular<\/strong><\/p><\/td><\/tr><tr><td><p><strong>3<\/strong><\/p><\/td><td><p><strong>Gelişen<\/strong><\/p><\/td><td><p><strong>İstenen kültür işe alım, uyum eğitimi, liderlik gelişimi, politika, performans geri bildirimi ve ücretlendirmeye yerleştirilmiş<\/strong><\/p><\/td><td><p><strong>Çalışanların gerçek deneyimlerine karşı kurumun kendi beklentilerine özgü sorular<\/strong><\/p><\/td><\/tr><tr><td><p><strong>4<\/strong><\/p><\/td><td><p><strong>Olgun<\/strong><\/p><\/td><td><p><strong>Kültür anlaşılmış ve uygulanıyor; insan davranışları operasyonel hedeflerle açıkça uyumlu<\/strong><\/p><\/td><td><p><strong>Anket, liderlik 360° değerlendirmesi, müşteri ve tedarikçi girdisi gibi araç portföyü<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Bu aşamalandırma, “her kurum aynı anketi yapsın” beklentisine karşı çıkar. Amacını ve değerlerini henüz yazmamış bir kurumun, “değerlerimiz karar vermeye yön veriyor mu?” diye sorması anlamsızdır; çünkü ortada sorulacak değer yoktur. Böyle bir kurum için önce basit bir temel anket, ardından amaç ve değerlerin tanımlanması gerekir. Olgun bir kurum ise anketle yetinmez; liderlik 360° değerlendirmesi, müşteri girdisi ve diğer kaynakları birleştirir.<\/p><h3 id=\"x16\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Araç seçimi<\/span><\/h3><div class=\"tw\"><table><thead><tr><th><p><strong>Araç<\/strong><\/p><\/th><th><p><strong>Ne için uygun?<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Çalışan anketi<\/strong><\/p><\/td><td><p><strong>Bağlılık bulgularını elde etmenin en yaygın aracıdır; genel (toplulaştırılmış) endeks üretmenin temelidir. Her anket anonimliği güvence altına almalıdır.<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Odak grup<\/strong><\/p><\/td><td><p><strong>Toplulaştırılmış sonuçlara girdi sağlar; etkili ve etkisiz motivasyon etkenlerini belirlemenin temelidir.<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Dış girdi<\/strong><\/p><\/td><td><p><strong>Çalışanların bağlılığına ilişkin üçüncü taraf bakış açısı; hizmet kuruluşlarında müşteri girdisi çok değerlidir (“bizimle çalışmak ne kadar kolay?”).<\/strong><\/p><\/td><\/tr><tr><td><p><strong>360° anketler<\/strong><\/p><\/td><td><p><strong>Liderlerin üstleri, akranları ve astlarınca değerlendirilmesi; beyan edilen değerlerin liderlerce ne kadar gösterildiğini anlamada yararlıdır.<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Çok ülkeli kurumlar için bir uyarı vardır: Liderlik ve motivasyon konularında veri toplayan her anket, tüm ülkelerde aynı çağrışım ve anlama sahip bir terminoloji kullanmalıdır; aksi hâlde veri uluslararası düzeyde karşılaştırılamaz. Bazı ulusal ve kurumsal kültürlerde kurumsal amaçla bağlılık düzeylerine ilişkin sorular daha az uygun olabilir ve kaçınılabilir ya da genel sonuçların daha düşük bir oranına ağırlıklandırılabilir.<\/p><h3 id=\"x17\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kültürün yaşam döngüsüne yerleşmesi<\/span><\/h3><p>Şartname, olgunluğun üçüncü aşamasında kültürün işe alım programlarına, uyum eğitimine, liderlik gelişimine, politika ve prosedürlere, performans geri bildirimine ve ücretlendirmeye yerleştirilmesini bekler. Bu liste, Bölüm 3 ve 4’te ele alınan süreçlerle kültürün nasıl bağlandığını gösterir. İşe alımda kişi profilinin değerlere uyumu sorgulanır; ön-uyum ve uyum eğitimi değerleri gösterir; liderlik gelişimi değerlerin yöneticilerin davranışına dönüşmesini sağlar; performans geri bildirimi değerlerle uyumlu davranışı da ölçer; ücretlendirme ise hangi davranışın ödüllendirildiğini ortaya koyar. Bu halkalardan birinde kopukluk olduğunda, beyan edilen kültür ile yaşanan kültür arasındaki boşluk büyür. Şartnamenin örneklerinden biri bunu çarpıcı biçimde anlatır: Yetersiz işe alım uygulamaları, kurumsal değerleri paylaşmayan çalışanları getirebilir; tutarsız amir yönlendirmesi daha düşük bağlılığa yol açabilir.<\/p><h3 id=\"x18\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Soru seçimi: Amaç, değer ve memnuniyet<\/span><\/h3><p>Şartnamenin soru seçimi ilkesi şudur: Seçilen sorular, çalışan bağlılığı düzeyleri ile örgüt kültürü arasında anlamlı bir bağ kurmalı; sonuçlar, düşük performansın olası nedenini belirleyip ortadan kaldıracak eylemi mümkün kılmalıdır. Sorular üç gruba ayrılır.<\/p><ul><li><strong>Amaçla ilgili sorular göreve yöneliktir.<\/strong> Kurumun net bir amacı var mı, amaca ulaşma planları iletildi mi, özel rolünüz net tanımlı mı, işinizi yapmak için gereken araç ve ekipmana erişiminiz var mı, geri bildirim alıyor musunuz, önerileriniz duyuluyor mu, iş yükünüz adil ve makul mü?<\/li><li><strong>Değerlerle ilgili sorular davranışsal ortamı belirler.<\/strong> Kurumun net bir davranışsal değerler kümesi var mı, bu değerler karar vermeye yön veriyor mu, doğrudan amirim bu değerleri tutarlı uyguluyor mu?<\/li><li><strong>Memnuniyet soruları<\/strong> ücret, teşvik ve prim planları ile yan haklar gibi alanları ölçer; motivasyon bakımından sınırlıdır ama olumsuz tutumlar üzerinde önemli etkisi olabilir.<\/li><\/ul><p>Şartnamenin kilit mesajı, düşük bağlılığın ve düşük güvenin, anketler beyan edilen ile gerçek davranış arasındaki boşluğu gösterdiğinde görüldüğüdür. Yüksek bağlılık, işgücü beyan edilen beklentileri bildiğinde, anladığında ve eylemde gözlemlediğinde ortaya çıkar.<\/p><h3 id=\"x19\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Temel kültür anketi: 25 ifade (Ek A)<\/span><\/h3><p>Ek A, bir kurumda kültür henüz net tanımlanmadan ve iş uygulamalarına yerleştirilmeden önce kullanılan 25 ifadelik genel bir anket örneğidir. Her ifade beşli ölçekle puanlanır: kesinlikle katılıyorum 5, katılıyorum 4, ne katılıyorum ne katılmıyorum 3, katılmıyorum 2, kesinlikle katılmıyorum 1. Toplam puan 125’e bölünerek genel yüzde sonuç elde edilir (25 ifade × en fazla 5 puan).<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>İfadeler<\/strong><\/p><\/th><th><p><strong>Ne belirlemek için?<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>1 ve 2<\/strong><\/p><\/td><td><p><strong>Bir amaç ifadesinin var olup olmadığını belirlemek<\/strong><\/p><\/td><\/tr><tr><td><p><strong>3<\/strong><\/p><\/td><td><p><strong>Bir değer ifadesinin var olup olmadığını belirlemek<\/strong><\/p><\/td><\/tr><tr><td><p><strong>4–7<\/strong><\/p><\/td><td><p><strong>Amaca ilişkin ilk çalışan bakış açısını (kendi gerçekliklerini) değerlendirmek<\/strong><\/p><\/td><\/tr><tr><td><p><strong>8–19<\/strong><\/p><\/td><td><p><strong>Davranışsal değerlere ilişkin ilk çalışan bakış açısını değerlendirmek<\/strong><\/p><\/td><\/tr><tr><td><p><strong>20–25<\/strong><\/p><\/td><td><p><strong>Çalışanın, liderliğin beyan edilen değerlerle hizalanmasına ilişkin görüşünü değerlendirmek<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"x20\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kurgusal örnek: 25 ifadenin puanlanması<\/span><\/h3><p>Anadolu Örnek A.Ş.’de 900 yanıtın ifade bazında ortalamaları hesaplanmış ve beş yönde gruplanmıştır.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Yön<\/strong><\/p><\/th><th><p><strong>İfadeler<\/strong><\/p><\/th><th><p><strong>İfade sayısı<\/strong><\/p><\/th><th><p><strong>Ortalama puan<\/strong><\/p><\/th><th><p><strong>Toplam puan<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Amaç ifadesi<\/strong><\/p><\/td><td><p><strong>1–2<\/strong><\/p><\/td><td><p><strong>2<\/strong><\/p><\/td><td><p><strong>4,2<\/strong><\/p><\/td><td><p><strong>8,4<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Değer ifadesi<\/strong><\/p><\/td><td><p><strong>3<\/strong><\/p><\/td><td><p><strong>1<\/strong><\/p><\/td><td><p><strong>3,4<\/strong><\/p><\/td><td><p><strong>3,4<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Amaç gerçekliği<\/strong><\/p><\/td><td><p><strong>4–7<\/strong><\/p><\/td><td><p><strong>4<\/strong><\/p><\/td><td><p><strong>3,9<\/strong><\/p><\/td><td><p><strong>15,6<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Davranışsal değerler<\/strong><\/p><\/td><td><p><strong>8–19<\/strong><\/p><\/td><td><p><strong>12<\/strong><\/p><\/td><td><p><strong>3,8<\/strong><\/p><\/td><td><p><strong>45,6<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Liderlik hizalaması<\/strong><\/p><\/td><td><p><strong>20–25<\/strong><\/p><\/td><td><p><strong>6<\/strong><\/p><\/td><td><p><strong>3,5<\/strong><\/p><\/td><td><p><strong>21,0<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Toplam<\/strong><\/p><\/td><td><p><strong>1–25<\/strong><\/p><\/td><td><p><strong>25<\/strong><\/p><\/td><td><p><strong>—<\/strong><\/p><\/td><td><p><strong>94,0<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"box\"><p><strong>Genel kültür puanı<\/strong><\/p><p>Genel yüzde = toplam puan ÷ 125 × 100 = 94,0 ÷ 125 × 100 = %75,2. Genel puan kabul edilebilir görünür; ama şartnamenin önerdiği gibi en düşük iki ya da üç ifadeye bakıldığında, en zayıf yönün liderlik hizalaması (3,5) ve değer ifadesi (3,4) olduğu görülür.<\/p><\/aside><p>Şartname, sonuçların en düşük puanlı iki ya da üç ifadeden başlayarak ele alınmasını önerir. Örneğin 2. ifade (amaç ifadesinin yaygınlığı) düşük ya da karışıksa, bir değer ifadesinin daha fazla geliştirilmesi düşünülür. Bizim örneğimizde 3. ifadenin (değer ifadesi) düşük çıkması, değerlerin yazılı olduğu ama yeterince bilinmediği anlamına gelebilir. Liderlik hizalamasının (20–25) en düşük olması ise “beyan edilen ile gerçek davranış arasında boşluk” senaryosunu çağrıştırır: Değer ifadeleri yüksek puan alırken yöneticilerin bu değerlere uygun davranmadığı algılanıyor olabilir. Amir güveni (ifade 20) ile üst yönetim güveni (ifade 21) arasındaki fark, sorunun nerede yoğunlaştığını gösterir.<\/p><p>Şartnamenin en önemli notu, anketin değerinin eyleme dönüşmesinde olduğudur. Sonuçlar her durumda odak gruplar, kent toplantıları (town hall) ve çalışma grupları gibi yaklaşımlarla çalışanlarla tartışılmalı; altta yatan kök nedenler belirlenmeli ve sorunları iyileştirecek girişimler geliştirilmelidir. Anketi yalnızca sorunları keşfetmek için kullanıp harekete geçmeyen bir kurum, bir sonraki ankette düşen katılım ve güvenle karşılaşır.<\/p><h3 id=\"x21\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Bağlılık endeksi raporlaması<\/span><\/h3><p>Şartname, 0 ile 100 arasında ölçeklenen bir bağlılık endeksini bölgelere ve yıllara göre raporlamayı örnekler. Örnekte “ortalama bağlılık endeksi”, bölge değerlerinin basit ortalamasıdır.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Bölge<\/strong><\/p><\/th><th><p><strong>2018<\/strong><\/p><\/th><th><p><strong>2017<\/strong><\/p><\/th><th><p><strong>2016<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Avrupa<\/strong><\/p><\/td><td><p><strong>84<\/strong><\/p><\/td><td><p><strong>83<\/strong><\/p><\/td><td><p><strong>80<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Asya/Pasifik<\/strong><\/p><\/td><td><p><strong>86<\/strong><\/p><\/td><td><p><strong>85<\/strong><\/p><\/td><td><p><strong>81<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Kuzey Amerika<\/strong><\/p><\/td><td><p><strong>81<\/strong><\/p><\/td><td><p><strong>81<\/strong><\/p><\/td><td><p><strong>76<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Ortalama bağlılık endeksi (0–100)<\/strong><\/p><\/td><td><p><strong>84<\/strong><\/p><\/td><td><p><strong>83<\/strong><\/p><\/td><td><p><strong>79<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Bu tablo şartnamedeki örnektir. Basit ortalama her bölgeye eşit ağırlık verir; çalışan sayısıyla ağırlıklı ortalama ise büyük bölgenin sonucunu daha çok yansıtır. Kurgusal bir ağırlıkla (Avrupa 200, Asya/Pasifik 100, Kuzey Amerika 700 çalışan) 2018 için ağırlıklı ortalama (84 × 200 + 86 × 100 + 81 × 700) ÷ 1.000 = 82,1’dir; basit ortalama ise 83,7’dir. İki sayı arasındaki 1,6 puanlık fark, çalışanların çoğunun en düşük puanlı bölgede çalıştığını gösterir. Dış raporlamada hangi ortalamanın kullanıldığı mutlaka yazılmalıdır.<\/p><h3 id=\"x22\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Metrik 2: Tutma oranı analitiği<\/span><\/h3><p>Tutma oranı, kurumsal kültürle ilgili göstergelerden biridir ve genel işgücü memnuniyeti düzeyini yansıtabildiği için sıklıkla istikrar endeksi olarak anılır. Şartname tutma oranının hem dönem başı ile sonu arasındaki genel değişimi, hem de nedensel analizi mümkün kılan altta yatan ayrıntıları göstermesini ister. Tutma ve devir metriklerinin ayrıntılı tartışması ISO/TS 30421’de yer alır (bölüm 5.5).<\/p><p>Tutma oranının amacı, çalışma ortamının ya da kültürün istenen işgücünü elde tutmada ne kadar etkili olduğunu göstermektir. Kişisel ya da kariyer gelişimi nedenleriyle bir miktar devir ve çalışan kaybı kaçınılmazdır ve bazen olumludur; ancak olumlu bir kültür, işgücü üyelerine kurum içinde kalmaları için teşvik sağlamalıdır. Şartname kırılımlar önerir: ülke, şirket, bağlı ortaklık ya da bölüm bazında genel tutma oranları; departman bazında; hizmet yılına göre; ve kuruma uygun diğer analitikler. Liderliğin etkili bir kültür oluşturmadaki kritik rolü nedeniyle tutma düzeylerinin her analizi örgüt yapısı ve raporlama çerçevesiyle hizalanmalıdır.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Kayıp türü<\/strong><\/p><\/th><th><p><strong>Olası işaret<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Deneme ya da eğitim döneminde kaybedilen çalışanlar<\/strong><\/p><\/td><td><p><strong>Olası işe alım sorunları<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Deneme sonrası ama işe alımdan sonraki bir ila iki yıl içindeki kayıplar<\/strong><\/p><\/td><td><p><strong>Beyan edilen kültürün, yaşanan kültür olmadığına işaret edebilir<\/strong><\/p><\/td><\/tr><tr><td><p><strong>“Gerekçeli” feshedilen çalışanlar<\/strong><\/p><\/td><td><p><strong>Nedenlerin alt analizi yapılabilir<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Farklı tutma oranları sergileyen departmanlara ya da departmanlardan transferler<\/strong><\/p><\/td><td><p><strong>Departmanlar arası farklı kültür deneyimi<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Kurum içinde ama başlangıç grubunun dışında terfi edenler<\/strong><\/p><\/td><td><p><strong>Olumlu kayıp; grup tutma oranında kayıp görünür<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Emeklilik nedeniyle gönüllü ya da zorunlu kayıplar<\/strong><\/p><\/td><td><p><strong>Normal, çoğunlukla kültürle ilgisiz kayıp<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Bu tablonun öğrettiği ders, aynı tutma oranının farklı kültürel sorunlara işaret edebileceğidir. İşe başlayan çalışanların ilk altı ayda ayrılması, işe alım sürecindeki beklenti–gerçeklik uyumsuzluğunu; bir ile iki yıl arasındaki kayıp, ilk uyum sonrası yaşanan hayal kırıklığını; belirli bir bölümde yoğunlaşan kayıp ise yönetici sorununu gösterebilir. Şartnamenin ifadesiyle istenen bir kültürü sürdürmek, söz ile eylem arasındaki tutarlılığa dayanan temel bir zorluktur.<\/p><h3 id=\"x23\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Bağlam ve öngörü etkenleri<\/span><\/h3><p>Bağlılık için bağlam etkenleri arasında ulusal ya da bölgesel kültür, sektör, kurumun büyüklüğü ve yapısı, önemli olaylar (ekonomik daralmalar, birleşmeler ve devralmalar, kurumsal amaçtaki önemli değişiklikler, sahiplik değişiklikleri), mevcut yönetim güvenilirliği ve mevcut bağlılık düzeyi sayılır. Kamu kurumlarının kültürü özel kurumlardan, sahibi tarafından yönetilen kurumların halka açık kurumlardan, olgun kurumların yeni girişimci kurumlardan farklıdır. Öngörü etkenleri ise yönetime güven eksikliği ya da liderlik değişiklikleri gibi etkenlerle birlikte, yeni BT sistemleri, yeni politikalar ya da işi etkileyen mevzuat değişiklikleri gibi planlanan olaylardır; bunlar öngörüldüğünde önleyici eylem planlanabilir.<\/p><p>Tutma için dış bağlam etkenleri sanayi türü (yeni ortaya çıkan, istikrarlı ya da gerileyen), sektör (özellikle kritik becerileri tutmaya odaklanırken), yerel istihdam durumu, genel ekonomik koşullar ve işverenin pazardaki itibarıdır. İç etkenler ise normal tutmanın stratejik düzeyleri, sektör normuna göre ücret aralığı, kurumun istikrarı ve işgücünün ortalama kıdemi ya da yaşıdır. Sektör kıyaslaması ve işveren kuruluşları ile ticaret gruplarından edinilen bilgiler, tutmanın kabul edilebilir olduğu aralıkları belirlemeye yardım eder.<\/p><h3 id=\"x24\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kurgusal vaka: Değerler yüksek, davranış düşük<\/span><\/h3><p>Anadolu Örnek A.Ş.’nin lojistik biriminde 25 ifadelik anketin değer ifadesi (3. ifade) 4,3 ile yüksek, liderlik hizalaması ise 2,9 ile düşüktür. Başka bir ifadeyle çalışanlar şirketin değerlerini biliyor ve benimsiyor; ama yöneticilerinin bu değerlere uygun davrandığına inanmıyor. Bu, şartnamenin tarif ettiği klasik “beyan edilen ile gerçek davranış arasındaki boşluk” tablosudur. Amir güveni (ifade 20) 3,4, üst yönetim güveni (ifade 21) ise 2,5’tir; yani sorun yalnızca doğrudan yöneticilerde değil, daha çok üst yönetime duyulan güvende yoğunlaşmaktadır. Aynı birimde bir ile iki yıl arasındaki gönüllü kayıplar da yılda %9’a çıkmıştır. İki bulgu birlikte okunduğunda, birimin yöneticilerine bir davranış eğitimi vermek yerine, üst yönetimin kararlarını ve gerekçelerini şeffaf biçimde paylaşmasını sağlayacak bir kent toplantısı düzeni kurmak ve kayıpların nedenini çıkış görüşmesi ile ayrılma sonrası anketle ayrıştırmak daha uygun görünür. Rakamlar kurgusaldır; mekanizma şartnameden gelir.<\/p><h3 id=\"x25\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Yorum, sınırlamalar ve raporlama<\/span><\/h3><ul><li><strong>Genel endeks yüksek ama bazı boyutlar düşükse ortalama yanıltır.<\/strong> Beş yönü ayrı okuyun.<\/li><li><strong>Beyan edilen ve gerçek davranış arasında boşluk varsa<\/strong> (değer ifadeleri yüksek, liderlik hizalaması düşük) bağlılık ve güven düşer.<\/li><li><strong>Düşük yanıt oranı sonucu temsil edilemez kılar.<\/strong> Yanıtlamayanların hangi bölümde yoğunlaştığına bakın.<\/li><li><strong>Bölgeler arası fark büyükse toplam ortalama ayrımı gizler.<\/strong> Basit ve ağırlıklı ortalama arasındaki fark bunu gösterir.<\/li><li><strong>Kayıplar olumlu da olabilir.<\/strong> İç terfi ve emeklilik, kültür sorununa işaret etmez.<\/li><li><strong>Bağlama bakmadan sonucu kötü ya da iyi ilan etmeyin.<\/strong> Birleşme, yönetim değişikliği ya da ekonomik daralma bağlılığı etkiler.<\/li><\/ul><p>Şartname 25 ifadelik anketin geliştiricilere kendi ifadelerini oluşturmada geniş serbestlik bıraktığını belirtir; ancak kültürün mevcut durumunu erken aşamalarda değerlendirirken ifadelerin beş yönü kapsaması önemlidir. Rehber sayfasındaki Türkçe ifade karşılıkları özgün çevirilerdir ve psikometrik geçerliliği sınanmış bir Türkçe form değildir; anketi kendi kurumunuza uyarlarken geçerliliği ayrıca sınayın. Standart, kültür ölçümünün öznel yönlerini de kabul eder: Sayı nedeni söylemez; kök neden için çalışanlarla görüşmek gerekir.<\/p><p>Raporlamada İK ve kültür sorumluları ifade bazında puanları, boyut puanlarını, yanıt oranını, tutma kırılımlarını ve bağlam notlarını; üst yönetim genel endeksi ve eğilimi, en zayıf boyutu, en düşük iki ya da üç ifadeyi, tutma oranını ve bölge farklarını skor kartında görür. Dış paydaşlara karşılaştırılabilir kültür göstergesi ISO 30414 ile birlikte sunulur; yöntem dipnotu (basit ya da ağırlıklı ortalama, anket ölçeği, yanıt oranı) mutlaka yer almalıdır.<\/p><h3 id=\"x26\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Metrik seçim adımları<\/span><\/h3><ol><li>Kültürel olgunluk aşamanızı belirleyin: amaç ve değerleriniz tanımlı mı?<\/li><li>Aşama 1–2 için Ek A’daki temel anketi, aşama 3–4 için kurumunuza özgü soruları kullanın.<\/li><li>Anonimliği güvence altına alın ve çok ülkeli kurumlarda terminolojiyi eşitleyin.<\/li><li>Anketi beş yönde puanlayın ve en düşük iki ya da üç ifadeyi belirleyin.<\/li><li>Sonuçları odak grup ve çalışma gruplarıyla tartışın; eylem planı yazın.<\/li><li>Tutma oranını kayıp türlerine ve kırılımlara göre analiz edin.<\/li><li>Bağlam ve öngörü etkenlerini sayıyla birlikte raporlayın.<\/li><\/ol>", "heads": [["x14", "Standardın amacı ve konumu"], ["x15", "Ölçümün derinliği kültürel olgunluğa bağlıdır"], ["x16", "Araç seçimi"], ["x17", "Kültürün yaşam döngüsüne yerleşmesi"], ["x18", "Soru seçimi: Amaç, değer ve memnuniyet"], ["x19", "Temel kültür anketi: 25 ifade (Ek A)"], ["x20", "Kurgusal örnek: 25 ifadenin puanlanması"], ["x21", "Bağlılık endeksi raporlaması"], ["x22", "Metrik 2: Tutma oranı analitiği"], ["x23", "Bağlam ve öngörü etkenleri"], ["x24", "Kurgusal vaka: Değerler yüksek, davranış düşük"], ["x25", "Yorum, sınırlamalar ve raporlama"], ["x26", "Metrik seçim adımları"]], "g": 0}, {"t": "5.3  Çeşitlilik ve Kapsayıcılık", "kind": "chap", "html": "<header class=\"uh\"><div class=\"kick\">Bölüm 5<\/div><h2>5.3  Çeşitlilik ve Kapsayıcılık<\/h2><\/header><p class=\"sub\"><em>ISO 30415:2021 — Kurumlarda çeşitlilik ve kapsayıcılığı yerleştirmeye yönelik rehber.<\/em><\/p><h3 id=\"x27\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Standardın amacı ve konumu<\/span><\/h3><p>ISO 30415, kurumlarda çeşitlilik ve kapsayıcılığı (Ç&amp;K) yerleştirmeye yönelik uluslararası bir rehberdir. ISO/TC 260 tarafından hazırlanmış ilk baskıdır ve Birleşik Krallık’ta BS 76005:2017’nin yerini alır. Giriş bölümüne göre kapsayıcı bir işyeri, kurumsal sistem, politika, süreç ve uygulamalardaki eşitsizlikleri ve kişilerin bilinçli ve bilinçsiz önyargılarını ve davranışlarını ele alan süregelen bir taahhüt gerektirir. Bu cümle, standardın felsefesini özetler: Çeşitlilik bir kampanya değil, süregelen bir yönetim konusudur.<\/p><p>Standart; ön koşulları, hesap verebilirlik ve sorumlulukları, kapsayıcı kültürü ve bir Ç&amp;K çerçevesini, ardından İK yaşam döngüsünün dokuz aşamasını (işgücü planlaması, ücretlendirme, işe alım, işe başlama, öğrenme ve gelişim, performans yönetimi, yedekleme, hareketlilik, istihdamın sona ermesi), ürün ve hizmetleri, tedarik zincirini ve dış paydaşları kapsar. Her madde için eylemler, çeşitlilik boyutuna göre bölümlenerek analiz edilebilecek ölçü örnekleri ve olası çıktılar verir. Toplamda 177 eylem, 83 ölçü örneği ve 86 çıktı örneği vardır.<\/p><p>Standart bir sertifikasyon şartnamesi ya da uygunluk sınavı değildir. Eylemler “yapmalı” kipindedir, ama her kurumun yaklaşımını kendi bağlamına göre belirlemesi beklenir. Sendika ya da iş konseyi ilişkilerinin özel yönlerini, ülkeye özgü uyumu, yasal gereklilikleri ve davaları ele almaz. Boyutlara göre analiz edilen kişisel veriler için yerel veri koruma mevzuatı ayrıca uygulanır.<\/p><h3 id=\"x28\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Çeşitlilik boyutları ve kesişimsellik<\/span><\/h3><p>Standart çeşitliliği, insanlar arasındaki farklılıkların ve benzerliklerin özellikleri olarak tanımlar. Boyutlar arasında yaş, engellilik, cinsiyet, cinsel yönelim, toplumsal cinsiyet kimliği, ırk, renk, uyruk, etnik ya da ulusal köken, din ya da inanç ve sosyo-ekonomik bağlam yer alır; bunların çoğu ülkelerde hukuki gerekliliklerle ilişkilidir. Boyutların kesişimi (kesişimsellik) de tanınmalıdır: Bir kadın çalışanın deneyimi ile engelli bir kadın çalışanın deneyimi aynı değildir. Bu nedenle standart, ölçülerin “bütünleşik ve çeşitlilik boyutuna göre bölümlenmiş” analiz edilmesini ister.<\/p><p>Türkiye bağlamında bu boyutların hangilerinin hangi biçimde toplanabileceği, kişisel verilerin korunması mevzuatıyla sınırlıdır; bazı boyutlar (din, etnik köken) özel nitelikli kişisel veridir ve toplanmaları ağır koşullara bağlıdır. Standart bunu açıkça kapsam dışı bırakır ve yerel hukuka havale eder. Kurum bu durumda, gönüllü ve anonim anketler, toplulaştırılmış veriler ve çalışan görüşmeleri gibi yöntemlere başvurabilir; ama hiçbir durumda yasal sınırı aşmamalıdır.<\/p><h3 id=\"x29\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Altı ön koşul ve hesap verebilirlik zinciri<\/span><\/h3><div class=\"tw\"><table><thead><tr><th><p><strong>Ön koşul<\/strong><\/p><\/th><th><p><strong>Anlamı<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Çeşitliliği tanımak<\/strong><\/p><\/td><td><p><strong>Çeşitliliğin kurumdaki mevcut durumunu ve değerini açıkça kabul etmek<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Etkin yönetmek<\/strong><\/p><\/td><td><p><strong>Yönetişim ve süreçleri çeşitliliği destekleyecek biçimde kurmak<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Hesap verebilir davranmak<\/strong><\/p><\/td><td><p><strong>Sonuçları paylaşmak ve sorumluluğu üstlenmek<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Kapsayıcı çalışmak<\/strong><\/p><\/td><td><p><strong>Günlük uygulamalarda herkesi dahil eden bir çalışma biçimi<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Kapsayıcı iletişim kurmak<\/strong><\/p><\/td><td><p><strong>Dil ve kanalları herkes için erişilebilir kılmak<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Savunuculuk yapmak<\/strong><\/p><\/td><td><p><strong>Kurum içinde ve dışında kapsayıcılığı desteklemek<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Hesap verebilirlik zinciri üst yönetimden bireye uzanır. Yönetim organı ve üst yönetim ilke ve hedefleri belirler ve kaynak sağlar. Liderler çerçeveyi kurar. İşlevsel alanların yöneticileri sorumluluğu devralır. Herkesin bireysel sorumluluğu vardır. Yıllık raporda Ç&amp;K fırsat ve riskleri ile ilerleme, kanıt ve iş gücü demografik verisiyle anlatılmalıdır. Bu, Bölüm 1’de anlatılan yönetişim yaklaşımıyla birebir örtüşür: Çeşitlilik bir İK programı değil, bir yönetim kurulu gündemidir.<\/p><h3 id=\"x30\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>İK yaşam döngüsünün dokuz aşaması<\/span><\/h3><p>Standardın en yoğun bölümü, İK yaşam döngüsünün her aşaması için eylem, ölçü ve çıktı örneklerini sunar. Bu bölümün değeri, Bölüm 2, 3 ve 4’te anlatılan süreçleri kapsayıcılık gözlüğüyle yeniden okumaktır.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Madde<\/strong><\/p><\/th><th><p><strong>Aşama<\/strong><\/p><\/th><th><p><strong>Odak<\/strong><\/p><\/th><th><p><strong>Eylem<\/strong><\/p><\/th><th><p><strong>Ölçü<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>8.2<\/strong><\/p><\/td><td><p><strong>İşgücü planlaması<\/strong><\/p><\/td><td><p><strong>Planda Ç&amp;K, demografik karşılaştırma, az temsil<\/strong><\/p><\/td><td><p><strong>7<\/strong><\/p><\/td><td><p><strong>4<\/strong><\/p><\/td><\/tr><tr><td><p><strong>8.3<\/strong><\/p><\/td><td><p><strong>Ücretlendirme<\/strong><\/p><\/td><td><p><strong>Eşit değerde iş için eşit ücret, anomali ve farklar<\/strong><\/p><\/td><td><p><strong>9<\/strong><\/p><\/td><td><p><strong>4<\/strong><\/p><\/td><\/tr><tr><td><p><strong>8.4<\/strong><\/p><\/td><td><p><strong>İşe alım<\/strong><\/p><\/td><td><p><strong>Çeşitli kanallar, önyargısız araçlar, aşama verisi, uyumlaştırma<\/strong><\/p><\/td><td><p><strong>14<\/strong><\/p><\/td><td><p><strong>6<\/strong><\/p><\/td><\/tr><tr><td><p><strong>8.5<\/strong><\/p><\/td><td><p><strong>İşe başlama<\/strong><\/p><\/td><td><p><strong>Yapılandırılmış süreç, uyumlaştırma, destek kaynakları, ilk 6 ay<\/strong><\/p><\/td><td><p><strong>10<\/strong><\/p><\/td><td><p><strong>8<\/strong><\/p><\/td><\/tr><tr><td><p><strong>8.6<\/strong><\/p><\/td><td><p><strong>Öğrenme ve gelişim<\/strong><\/p><\/td><td><p><strong>Erişilebilir öğrenme, kapsayıcı içerik, lider gelişimi<\/strong><\/p><\/td><td><p><strong>11<\/strong><\/p><\/td><td><p><strong>7<\/strong><\/p><\/td><\/tr><tr><td><p><strong>8.7<\/strong><\/p><\/td><td><p><strong>Performans yönetimi<\/strong><\/p><\/td><td><p><strong>Önyargısız ölçütler, yapıcı geri bildirim, derecelendirici önyargısı<\/strong><\/p><\/td><td><p><strong>12<\/strong><\/p><\/td><td><p><strong>6<\/strong><\/p><\/td><\/tr><tr><td><p><strong>8.8<\/strong><\/p><\/td><td><p><strong>Yedekleme planlaması<\/strong><\/p><\/td><td><p><strong>Çeşitli yedek havuzu, erişim, mentorluk<\/strong><\/p><\/td><td><p><strong>9<\/strong><\/p><\/td><td><p><strong>7<\/strong><\/p><\/td><\/tr><tr><td><p><strong>8.9<\/strong><\/p><\/td><td><p><strong>İşgücü hareketliliği<\/strong><\/p><\/td><td><p><strong>Geçici görev, yer değiştirme, uzaktan alternatifler<\/strong><\/p><\/td><td><p><strong>11<\/strong><\/p><\/td><td><p><strong>5<\/strong><\/p><\/td><\/tr><tr><td><p><strong>8.10<\/strong><\/p><\/td><td><p><strong>İstihdamın sona ermesi<\/strong><\/p><\/td><td><p><strong>Yapılandırılmış, tarafsız, saygılı süreç; ayrımcı olmayan ölçütler<\/strong><\/p><\/td><td><p><strong>11<\/strong><\/p><\/td><td><p><strong>5<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Bu tablodaki bağlantılar somut bir yol haritası çizer. İşe alımda (8.4) en çok eylem bulunması (14), süreçte önyargının en çok yer aldığı noktanın işe alım olduğunu yansıtır; bu, Bölüm 3’te ISO 30405’in yapay zekâ ve değerlendirme önerileriyle doğrudan örtüşür. Ücretlendirmede “eşit değerde iş için eşit ücret” ilkesi, ücret farklarının iş aileleri, konumlar ve ücret yapıları içinde ve arasında incelenmesini gerektirir. Yedekleme planlamasında çeşitli bir yedek havuzu, Bölüm 2’deki ISO/TS 30433 metriklerinin kapsayıcılık boyutuyla okunması demektir. Performans yönetiminde derecelendirici önyargısı, Bölüm 3’te ele alınan işe alım kalitesi puanlarındaki “cömert ya da katı yönetici” sorununun benzeridir.<\/p><p>Teknoloji ve önyargı özel bir başlıktır. Algoritmalar, makine öğrenmesi ve otomatik İK sistemleri önyargı riski taşır; işe alımdan sona erişe kadar kararlar denetim ve denge mekanizmalarıyla desteklenmelidir (5.4, 8.1, 8.4). Standart ayrıca kapsayıcılığı yalnızca İK’nın konusu olarak görmez; ürün ve hizmetlerin kapsayıcı tasarımını (madde 9), tedarikçi çeşitliliği ve tedarik zincirinde insana yakışır işi (madde 10) ve dış paydaşlarla ilişkileri (madde 11) de kapsar.<\/p><h3 id=\"x31\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Ölçü örnekleri ve türetilmiş formüller<\/span><\/h3><p>Standart hiçbir formül, ölçek ya da birim vermez; her madde için ölçü örnekleri sıralar ve bunların çeşitlilik boyutuna göre analiz edilmesini ister. Rehber sayfası bu örnekleri sayıya dökmek için dört temel hesabı türetir; hepsi “türetilmiş” olarak işaretlenmiştir.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Hesap<\/strong><\/p><\/th><th><p><strong>Formül<\/strong><\/p><\/th><th><p><strong>Okuma<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Temsil endeksi<\/strong><\/p><\/td><td><p><strong>(Grubun işgücü payı ÷ referans nüfus payı) × 100<\/strong><\/p><\/td><td><p><strong>100 eşit temsil; altı az temsil<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Aşama geçiş (etki) oranı<\/strong><\/p><\/td><td><p><strong>Grubun geçiş oranı ÷ referans grubun geçiş oranı<\/strong><\/p><\/td><td><p><strong>Bir süreç aşamasının gruplar üzerindeki orantısız etkisi için tarama göstergesi<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Ücret farkı<\/strong><\/p><\/td><td><p><strong>(Referans ortalama − grup ortalama) ÷ referans ortalama × 100<\/strong><\/p><\/td><td><p><strong>İş ailesi ve düzey içinde okunur<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Ayrılma oranı<\/strong><\/p><\/td><td><p><strong>Ayrılan ÷ ortalama kadro × 100<\/strong><\/p><\/td><td><p><strong>Gruba göre bölümlenir<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"x32\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kurgusal örnek: Kadın temsili, işe alım geçişi ve ücret farkı<\/span><\/h3><p>Anadolu Örnek A.Ş.’nin 1.200 çalışanı vardır; bunların 420’si kadındır (%35). Şirketin faaliyet gösterdiği bölgedeki ilgili sektörde kadın işgücü payı %46’dır; bu değer referans nüfus payı olarak alınmıştır. Yönetici kadrosunda 240 kişiden 60’ı kadındır (%25).<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Gösterge<\/strong><\/p><\/th><th><p><strong>Hesap<\/strong><\/p><\/th><th><p><strong>Sonuç<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Genel temsil endeksi (kadın)<\/strong><\/p><\/td><td><p><strong>35 ÷ 46 × 100<\/strong><\/p><\/td><td><p><strong>76,1<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Yönetici düzeyinde temsil endeksi<\/strong><\/p><\/td><td><p><strong>25 ÷ 46 × 100<\/strong><\/p><\/td><td><p><strong>54,3<\/strong><\/p><\/td><\/tr><tr><td><p><strong>İşe alım aşama geçişi: kadın<\/strong><\/p><\/td><td><p><strong>20 ÷ 400<\/strong><\/p><\/td><td><p><strong>%5,0<\/strong><\/p><\/td><\/tr><tr><td><p><strong>İşe alım aşama geçişi: erkek<\/strong><\/p><\/td><td><p><strong>45 ÷ 600<\/strong><\/p><\/td><td><p><strong>%7,5<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Etki oranı<\/strong><\/p><\/td><td><p><strong>5,0 ÷ 7,5<\/strong><\/p><\/td><td><p><strong>0,67<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Ücret farkı (ortalama 62.000 TL; kadın 58.280 TL)<\/strong><\/p><\/td><td><p><strong>(62.000 − 58.280) ÷ 62.000 × 100<\/strong><\/p><\/td><td><p><strong>%6,0<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Tablo üç ayrı sinyal verir. Temsil endeksi 76,1’dir; yönetici düzeyinde ise 54,3’e düşer; yani sorun yalnızca toplam sayıda değil, kıdem arttıkça açılan bir makastadır. Standart da bu noktaya değinir: Asıl önemli olan, seviyelere (kıdem, yönetim, yönetişim organı) göre de bakmaktır. İşe alım aşamasında kadın adayların teklif aşamasına geçişi %5’tir, erkeklerin %7,5’i; etki oranı 0,67’dir. Bazı ülkelerde 0,8 (dörtte beş) eşiği kullanılır; ancak bu eşik standarttan gelmez, hukuki sonuç ülkeden ülkeye değişir ve oran tek başına ayrımcılığın kanıtı değil, aşamadaki ölçütlerin ve otomatik sistemlerin gözden geçirilmesi için bir işarettir. Küçük örneklemlerde tesadüfi dalgalanma olabileceği de unutulmamalıdır.<\/p><p>Ücret farkı %6,0’dır; ama bu ortalama bir farktır ve iş içeriği, kıdem, kademe ve konumdan etkilenir. Standart farkları iş aileleri, konumlar ve ücret yapıları içinde ve arasında incelemeyi söyler. Açıklanamayan farklar, “eşit değerde iş için eşit ücret” ilkesi açısından ele alınır. Burada kritik bir adım, ortalama farkı iş ailesi ve düzey bazında ayrıştırmaktır: Eğer fark kadınların düşük ücretli iş ailelerinde yoğunlaşmasından kaynaklanıyorsa sorun ücretlendirme değil, işe alım ve yedekleme kanallarındadır; fark aynı iş ailesi ve düzeyde ortaya çıkıyorsa sorun doğrudan ücret kararlarındadır.<\/p><h3 id=\"x33\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kurgusal vaka: Kıdemle açılan makas<\/span><\/h3><p>Anadolu Örnek A.Ş.’de kadınların işe alım hunisindeki payı %40, genel işgücündeki payı %35, yönetici kadrosundaki payı %25’tir. Standardın hayat döngüsü yaklaşımı bu üç sayıyı bir hikâyeye çevirir: Kadınlar işe alımda makul temsil edilmekte, ama yükselme ve yedekleme aşamalarında daralmaktadır. Yedekleme planlamasında (Bölüm 2.4) kadın adayların yedek havuzundaki payı %18’dir. Performans yönetiminde kadınların ortalama puanı erkeklerden 0,2 puan düşüktür; derecelendirici önyargısı şüphesi oluşmuştur. Şirket, yönetici gözetiminde yapılan kalibrasyon oturumlarını başlatır, yedek havuzu için aday belirleme ölçütlerini yazılı hâle getirir ve terfi kararlarında ikinci bir gözden geçirme zorunlu kılar. Kurum bu ölçülerin etkisini 18 ay sonra yeniden hesaplamayı planlar. Bu vaka kurgusaldır; ancak standardın “yaşam döngüsü boyunca bütünleşik ve bölümlenmiş analiz” ilkesinin işleyişini gösterir.<\/p><h3 id=\"x34\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Ek A: Öz değerlendirme ve kapsama<\/span><\/h3><p>Ek A, 5–11. maddelerin 177 eylemini bir öz değerlendirme listesi olarak derler; her eylem için “destekleyici kanıt” istenir. Rehber sayfasındaki kapsama puanı türetilmiştir: (uygulanan + 0,5 × kısmen) ÷ toplam × 100. Kurgusal şirketimizde 177 eylemin 90’ı uygulanıyor, 50’si kısmen uygulanıyor, 37’si uygulanmıyor olsun. Kapsama = (90 + 25) ÷ 177 × 100 = %65,0’dır. Hedef kapsama %70 ise şirket hedefin beş puan altındadır. Ancak kapsama yüzdesi kanıtın yerine geçmez; hedefin altındaki maddelerde eksik eylemleri belirleyip boşluk kapatma stratejisi yazmak gerekir.<\/p><h3 id=\"x35\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Tedarik zinciri ve dış paydaşlar<\/span><\/h3><p>ISO 30415’in İK ile sınırlı olmayan yönü, kapsayıcılığı kurumun tedarik zincirine ve dış ilişkilerine yaymasıdır. Ürün ve hizmetlerde (madde 9) kapsayıcı tasarım, pazarlama dilinin dışlayıcı olmaması ve müşteri geri bildiriminin çeşitli gruplardan alınması istenir. Tedarikte (madde 10) tedarikçi çeşitliliği, sözleşme maddelerinde insana yakışır iş ve kapsayıcılık beklentileri ve izleme önerilir. Dış paydaş ilişkilerinde (madde 11) yatırımcılar, topluluklar, eğitim kurumları, düzenleyiciler ve savunuculuk grupları için ihtiyaç ve güç analizi yapılır. Bu maddeler, Bölüm 1’deki insan yönetişimi ve ISO 30414’ün dış raporlama yaklaşımıyla birlikte düşünüldüğünde, çeşitliliğin bir iç İK konusu olmaktan çıkıp kurumsal sürdürülebilirlik konusuna dönüştüğünü gösterir.<\/p><h3 id=\"x36\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Yorum, sınırlamalar ve raporlama<\/span><\/h3><ul><li><strong>Bölümlenmiş okuyun.<\/strong> Bütünleşik bir oran farkları gizler; ancak boyutlara göre bölümleme küçük gruplarda kişileri ele verebilir. Asgari raporlama büyüklüğü belirleyin ve veri koruma mevzuatına uyun.<\/li><li><strong>Temsil endeksi tek başına hedef değildir.<\/strong> Düzeylere (kıdem, yönetim, yönetişim organı) göre de bakın.<\/li><li><strong>Şikâyet sayısı iki yönlü okunur.<\/strong> Düşük sayı hem sorunun azlığını hem de bildirim eksikliğini gösterebilir; yüksek sayı güvenin arttığını da gösterebilir.<\/li><li><strong>Önce kanıt, sonra puan.<\/strong> Ölçü örneklerini çıktıların kanıtı olarak seçin ve hangi çıktıyı kanıtladığını belirtin.<\/li><\/ul><p>Standardın sınırlamaları arasında ölçü örneklerinin biçim tutarsızlığı (bazen sayı, bazen yüzde, bazen eğilim), çıktıların bir bölümünün doğrudan ölçülebilir olmaması (“aidiyet”, “güven”) ve bazı ISO/TS atıflarının kaynakçayla örtüşmemesi yer alır. Ek A yalnızca eylemleri listeler; ölçü ve çıktı örnekleri için ayrı bir kontrol listesi yoktur. Demografik veri toplama ve bölümlenmiş analiz, ülkeye göre farklı yasal sınırlara tabidir.<\/p><p>Raporlamada yönetişim organı ve üst yönetim Ç&amp;K ilke ve hedeflerini, fırsat ve risk derecelerini, hedeflere karşı ilerlemeyi ve yıllık rapor anlatısını iş gücü demografik verisiyle; İK ve Ç&amp;K sorumluları yaşam döngüsü aşamalarına göre ölçüleri, bölümlenmiş analizi, orantısız etki eğilimlerini, şikâyet ve çözüm verisini ve Ek A kapsamasını; yöneticiler ekibe ilişkin geri bildirimi, kapsayıcı davranış beklentilerini ve uyumlaştırma taleplerini görür.<\/p><h3 id=\"x37\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Uygulama adımları<\/span><\/h3><ol><li>Altı ön koşulu sağlayın: çeşitliliği tanıyın, hesap verebilir ve kapsayıcı olun, savunuculuk yapın.<\/li><li>Hesap verebilirliği tanımlayın: yönetim organından bireye.<\/li><li>Ç&amp;K çerçevesini kurun: ilke, hedef, sorumlu, eylem, ölçü, fırsat ve riskler.<\/li><li>Kapsayıcı kültürü destekleyin: ses mekanizmaları, davranış beklentileri, demografik verinin etik toplanması.<\/li><li>İK yaşam döngüsünün dokuz aşamasını gözden geçirin; algoritma ve otomasyon önyargısını denetleyin.<\/li><li>Ürün, tedarik ve dış paydaşlara yayın.<\/li><li>Kurum için önemli ölçüleri seçin ve bölümlenmiş analiz edin; Ek A’daki kanıtları toplayın.<\/li><li>Yıllık raporda anlatı, kanıt ve iş gücü demografik verisini paylaşın; hedefleri gözden geçirin.<\/li><\/ol>", "heads": [["x27", "Standardın amacı ve konumu"], ["x28", "Çeşitlilik boyutları ve kesişimsellik"], ["x29", "Altı ön koşul ve hesap verebilirlik zinciri"], ["x30", "İK yaşam döngüsünün dokuz aşaması"], ["x31", "Ölçü örnekleri ve türetilmiş formüller"], ["x32", "Kurgusal örnek: Kadın temsili, işe alım geçişi ve ücret farkı"], ["x33", "Kurgusal vaka: Kıdemle açılan makas"], ["x34", "Ek A: Öz değerlendirme ve kapsama"], ["x35", "Tedarik zinciri ve dış paydaşlar"], ["x36", "Yorum, sınırlamalar ve raporlama"], ["x37", "Uygulama adımları"]], "g": 0}, {"t": "5.4  İş Sağlığı ve Güvenliği Metrikleri", "kind": "chap", "html": "<header class=\"uh\"><div class=\"kick\">Bölüm 5<\/div><h2>5.4  İş Sağlığı ve Güvenliği Metrikleri<\/h2><\/header><p class=\"sub\"><em>ISO/TS 24179:2020 — Kayıp zaman, iş kazası, ölümlü kaza ve İSG eğitimi katılımı.<\/em><\/p><h3 id=\"x38\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Standardın amacı ve konumu<\/span><\/h3><p>ISO/TS 24179, ISO 30414’ün kurumsal sağlık, güvenlik ve iyi olma hâli kümesini ayrıntılandıran bir teknik şartnamedir. Dört metrik tanımlar: kayıp zaman, iş kazası sayısı, ölümlü kaza sayısı ve İSG eğitimine katılım oranı. Dördü de aynı basit biçimi kullanır: A = B ÷ C × 100. Belgenin asıl katkısı formüller değil, onların çevresindeki disiplindir: işgücü kategorilerinin tanımlanması, tüm olayların kayda geçirilmesi, verinin kırılımlandırılması ve sonucun bağlamıyla birlikte okunması.<\/p><p>Şartname bir ölçme belgesidir; İSG yönetim sisteminin kendisi ISO 45001’in konusudur. Metrikler o sistemin sonuçlarını izler, sistemin yerine geçmez. Bu ayrım pratik bir sonuca varır: Kaza oranı iyi görünen ama sistemi kurulmamış bir kurum, iyi bir İSG performansına sahip değil, iyi bir kayıt eksikliğine sahiptir.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Metrik<\/strong><\/p><\/th><th><p><strong>B (pay)<\/strong><\/p><\/th><th><p><strong>C (payda)<\/strong><\/p><\/th><th><p><strong>Raporlama önerisi<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Kayıp zaman (işle ilgili yaralanma, kaza ve hastalık)<\/strong><\/p><\/td><td><p><strong>Kaybedilen çalışma süresi<\/strong><\/p><\/td><td><p><strong>Planlanan çalışma süresi<\/strong><\/p><\/td><td><p><strong>Büyük kuruluşlarda ayrıca dış raporlama için önerilir<\/strong><\/p><\/td><\/tr><tr><td><p><strong>İş kazası sayısı<\/strong><\/p><\/td><td><p><strong>Kaza sayısı<\/strong><\/p><\/td><td><p><strong>Ortalama kadro<\/strong><\/p><\/td><td><p><strong>Büyük kuruluşlar ve KOBİ’ler için iç ve dış raporlama<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Ölümlü kaza sayısı<\/strong><\/p><\/td><td><p><strong>Ölen kişi sayısı<\/strong><\/p><\/td><td><p><strong>Ortalama kadro<\/strong><\/p><\/td><td><p><strong>Büyük kuruluşlar ve KOBİ’ler için iç ve dış raporlama<\/strong><\/p><\/td><\/tr><tr><td><p><strong>İSG eğitimine katılım<\/strong><\/p><\/td><td><p><strong>Eğitim katılımcısı sayısı<\/strong><\/p><\/td><td><p><strong>Ortalama kadro<\/strong><\/p><\/td><td><p><strong>Büyük kuruluşlar ve KOBİ’ler için iç raporlama<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Dört metrik de aynı formülü paylaştığından, değişen tek şey paydadır: Kayıp zamanda planlanan çalışma süresi, diğer üçünde ortalama kadro. Bu yüzden birimleri karıştırmamak kritiktir; saatle gün, kişiyle olay birbirine bölünmez.<\/p><h3 id=\"x39\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Kayıp zamanın dar tanımı<\/span><\/h3><p>Şartname kayıp zamanı dar tanımlar: Ölüm, kalıcı iş göremezlik ya da bir gün veya vardiya ve üzerinde iş kaybıyla sonuçlanan olaylar sayılır. Genel devamsızlık bu metrik değildir. Bu eşiğin altında kalan olaylar (ilk yardım müdahaleleri, ramak kalalar) metrikte görünmez; oysa öncü gösterge olarak en değerli veri çoğu zaman oradadır. Bu nedenle kurumlar kayıp zamana ek olarak ramak kala bildirimlerini ve hafif olay sayısını da izlemelidir.<\/p><h3 id=\"x40\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Ölümlü kaza: Yüzde değil, mutlak sayı<\/span><\/h3><p>Şartname açıkça söyler: Ölümlü kaza mutlak sayıyla da verilir. Yalnızca yüzde raporlamak, rakamın etkisine karşı duyarsızlaştırır; beş kişi “%0,4” değildir. Büyük kadrolarda yüzde sıfıra yakın görünür ve olayın ağırlığını gizler. Seyrek olaylar için yüz bin çalışan tabanı daha okunabilirdir. Bu, bu kitabın genel ilkesinin (oranların yanında mutlak sayılar) en ağır örneğidir.<\/p><h3 id=\"x41\" class=\"sec\"><button class=\"tg\" aria-label=\"Aç/kapat\"><\/button><span>Dokuz kırılım ekseni<\/span><\/h3><p>Metrik ne kadar ayrıntılı kırılırsa, analiz ve müdahale olanağı o kadar artar. Standart dokuz eksen sayar.<\/p><div class=\"tw\"><table><thead><tr><th><p><strong>Eksen<\/strong><\/p><\/th><th><p><strong>Ne sorar?<\/strong><\/p><\/th><\/tr><\/thead><tbody><tr><td><p><strong>Birim ya da masraf merkezi hiyerarşisi<\/strong><\/p><\/td><td><p><strong>Hangi organizasyon biriminde?<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Konum<\/strong><\/p><\/td><td><p><strong>Hangi tesiste, hangi sahada?<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Ürün hattı<\/strong><\/p><\/td><td><p><strong>Hangi üretim hattında?<\/strong><\/p><\/td><\/tr><tr><td><p><strong>İşlev<\/strong><\/p><\/td><td><p><strong>Hangi işlevde (bakım, lojistik, üretim)?<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Olay türü<\/strong><\/p><\/td><td><p><strong>Ne tür bir olay (burkulma, kırık, uzuv kaybı)?<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Olay alt kümesi<\/strong><\/p><\/td><td><p><strong>Türün içinde hangi alt kategori?<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Çalışan kategorisi<\/strong><\/p><\/td><td><p><strong>Kadrolu, geçici, yüklenici, dış kaynak?<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Günün saati<\/strong><\/p><\/td><td><p><strong>Hangi vardiyada, mesainin kaçıncı saatinde?<\/strong><\/p><\/td><\/tr><tr><td><p><strong>Olay anındaki İSG eğitim durumu<\/strong><\/p><\/td><td><p><strong>Kişi eğitimli miydi, tazeleme zamanı geçmiş miydi?<\/strong><\/p><\/td><\/tr><\/tbody><\/table><\/div><p>Dokuzuncu eksen, olay anındaki İSG eğitim durumu, çoğu
